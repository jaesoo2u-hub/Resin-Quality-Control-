                  <button onClick={() => setExcelState({...excelState, isOpen: false})} className="w-full md:w-auto px-5 py-2.5 text-gray-600 font-bold bg-gray-100 hover:bg-gray-200 rounded-lg order-2 md:order-1">취소</button>

                    <button onClick={() => handleImportExcelData('append_unique')} className="px-4 py-2.5 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 flex items-center justify-center gap-1 text-sm shadow-sm transition-colors"><Icons.Upload /> <span>중복 제외하고 추가</span></button>

      const renderAddPointModal = () => {
         if(!isAddPointModalOpen) return null;
         return (
            <div className="fixed inset-0 bg-gray-900/60 flex items-center justify-center z-[140] backdrop-blur-sm p-4 no-print">
               <div className="bg-white rounded-2xl shadow-xl w-full max-w-md border border-gray-100 p-6">
                   <h3 className="text-xl font-bold mb-4 text-gray-900 flex items-center gap-2"><Icons.Plus/> 관리 포인트 추가</h3>
                   <div className="space-y-4">
                       <div>
                           <label className="block text-sm font-bold text-gray-700 mb-1">포인트명 (필수)</label>
                           <input type="text" className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-indigo-500 font-medium" value={newPointForm.name} onChange={e => setNewPointForm({...newPointForm, name: e.target.value})} placeholder="예: 경도" />
                       </div>
                       <div className="grid grid-cols-3 gap-3">
                           <div>
                             <label className="block text-xs font-bold text-gray-500 mb-1">하한 (LSL)</label>
                             <input type="number" step="0.01" className="w-full border border-gray-300 rounded-lg p-2 outline-none focus:ring-2 focus:ring-indigo-500" value={newPointForm.lsl} onChange={e => setNewPointForm({...newPointForm, lsl: e.target.value})} />
                           </div>
                           <div>
                             <label className="block text-xs font-bold text-gray-500 mb-1">목표 (Target)</label>
                             <input type="number" step="0.01" className="w-full border border-gray-300 rounded-lg p-2 outline-none focus:ring-2 focus:ring-indigo-500" value={newPointForm.target} onChange={e => setNewPointForm({...newPointForm, target: e.target.value})} />
                           </div>
                           <div>
                             <label className="block text-xs font-bold text-gray-500 mb-1">상한 (USL)</label>
                             <input type="number" step="0.01" className="w-full border border-gray-300 rounded-lg p-2 outline-none focus:ring-2 focus:ring-indigo-500" value={newPointForm.usl} onChange={e => setNewPointForm({...newPointForm, usl: e.target.value})} />
                           </div>
                       </div>
                   </div>
                   <div className="flex gap-3 mt-6">
                       <button onClick={() => setIsAddPointModalOpen(false)} className="flex-1 py-2.5 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200">취소</button>
                       <button onClick={() => {
                           if (!newPointForm.name.trim()) { showToast('포인트명을 입력하세요.'); return; }
                           const updatedEntries = entries.map(entry => {
                             if (entry.id === selectedId) {
                               const newIndex = entry.points.length;
                               const updatedLogs = entry.logs.map(log => { const newValues = [...log.values]; newValues[newIndex] = ''; return { ...log, values: newValues }; });
                               return { ...entry, points: [...entry.points, { ...newPointForm }], logs: updatedLogs };
                             }
                             return entry;
                           });
                           updateAndSync(updatedEntries); setIsAddPointModalOpen(false); setNewPointForm({ name: '', lsl: '', target: '', usl: '' }); showToast("포인트 추가됨");
                       }} className="flex-1 py-2.5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700">추가하기</button>
                   </div>
               </div>
            </div>
         );
      };

      const renderExpandedChartModal = () => {
        if (expandedChart === null || expandedChart === undefined || expandedChart < 0) return null;
        const chartEntry = entries.find(e => e.id === selectedId);
        if (!chartEntry || expandedChart >= (chartEntry.points?.length || 0)) return null;

        const pointSpec = chartEntry.points[expandedChart];
        if (!pointSpec || pointSpec.name.trim() === '') return null;

        const renderGuide = (type) => {
            let terms = [];
            if (type === 'spc') terms = ['UCL / LCL', 'Moving Average', 'Western Rule', 'Target Drift', 'Sudden Jump'];
            else if (type === 'cap') terms = ['Cpk', 'Cpm', 'Sigma', 'Spread Increase', 'Spec-Out'];
            else if (type === 'dist') terms = ['Sigma', 'Spread Increase', 'Target Approach'];

            const relevantTerms = qualityAppTerms.filter(t => terms.includes(t.name) && t.isVisible);
            if (relevantTerms.length === 0) return null;

            return (
                <div className="bg-gray-50 border border-indigo-100 rounded-lg p-4 mt-4 shadow-sm text-sm">
                    <h4 className="font-bold text-indigo-800 flex items-center gap-1 mb-2"><span className="material-symbols-outlined icon-sm">help</span> 그래프 해석 가이드</h4>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {relevantTerms.map((t, i) => (
                            <div key={i} className="bg-white p-3 rounded shadow-sm border border-gray-100">
                                <div className="font-bold text-indigo-700 mb-1">{t.name}</div>
                                <div className="text-xs text-gray-600 whitespace-pre-wrap">{t.definition.split('\n\n').map((line, idx) => {
                                    if (line.includes('합성수지 Batch 생산에서의 의미:')) return <div key={idx} className="mt-1 font-bold">{line.replace('합성수지 Batch 생산에서의 의미:', '')}</div>;
                                    if (line.includes('해석 방법:')) return <div key={idx} className="mt-1 text-indigo-900 bg-indigo-50 p-1 rounded">{line.replace('해석 방법:', '👉')}</div>;
                                    return <div key={idx} className="mt-0.5">{line}</div>;
                                })}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        if (!expandedChart) return null;
        const entry = entries.find(e => e.id === selectedId);
        if (!entry) return null;

        const activePoints = (entry.points || []).map((p, i) => ({ ...p, originalIndex: i })).filter(p => p && p.name && String(p.name).trim() !== '');
        const sortedLogsAsc = Array.isArray(entry.logs) ? [...entry.logs].sort((a, b) => new Date(a.date) - new Date(b.date)) : [];

        const currentPoint = expandedChart.type !== 'multi' ? (activePoints[expandedChart.pointIdx] || activePoints[0]) : null;
        let chartLogs = currentPoint ? sortedLogsAsc.map(l => {
           let rawVal = (l.values && Array.isArray(l.values)) ? l.values[currentPoint.originalIndex] : null;
           let numVal = null;
           if (rawVal !== '' && rawVal != null) { const parsed = parseFloat(String(rawVal).trim().split(/[\s,\[\]]+/)[0]); if (!isNaN(parsed)) numVal = parsed; }
           return { id: l.id, date: l.date, lotNumber: l.lotNumber, content: l.content, value: numVal, rawVal: rawVal, editorName: l.editorName };
        }).filter(l => l.value !== null) : [];

        const n = chartLogs.length;
        let stats = { mean: 0, stdDev: 0, values: [] };
        let cpk = 0;
        let distData = [];
        let ucl = 0, lcl = 0, cl = 0;

        if (n > 0) {
            stats = getStats(chartLogs);
            cl = stats.mean;
            ucl = cl + 3 * stats.stdDev;
            lcl = cl - 3 * stats.stdDev;
            cpk = calculateCpk(stats, currentPoint && currentPoint.usl, currentPoint && currentPoint.lsl);
            distData = generateNormalDistData(stats, currentPoint && currentPoint.lsl, currentPoint && currentPoint.target, currentPoint && currentPoint.usl);

            chartLogs.forEach((log, index, arr) => {
                const startIdx = Math.max(0, index - 5 + 1);
                const subset = arr.slice(startIdx, index + 1).map(l => l.value);
                log.movingAverage = Number((subset.reduce((a,b)=>a+b, 0) / subset.length).toFixed(2));
                log.isOutlier = Math.abs(log.value - cl) > 3 * stats.stdDev;
                log.westernRulesTriggered = appSettings.useWesternRules ? checkWesternElectricRules(arr.slice(0, index+1).map(x=>x.value), cl, stats.stdDev).length > 0 : false;
            });

            if (n > 1) {
                let sum_x = 0, sum_y = 0, sum_xy = 0, sum_xx = 0;
                chartLogs.forEach((log, i) => { sum_x += i; sum_y += log.value; sum_xy += i * log.value; sum_xx += i * i; });
                const m = (n * sum_xy - sum_x * sum_y) / (n * sum_xx - sum_x * sum_x);
                const b = (sum_y - m * sum_x) / n;
                chartLogs.forEach((log, i) => { log.linearTrend = Number((m * i + b).toFixed(2)); });
            } else if (n === 1) {
                chartLogs[0].linearTrend = chartLogs[0].value;
            }

            if (expandedChart.type === 'cpk') {
                let tempLogs = getMovingStats(chartLogs, appSettings.trendBatchCount || 5, currentPoint ? currentPoint.usl : null, currentPoint ? currentPoint.lsl : null, movingWindow);
                chartLogs.length = 0;
                tempLogs.forEach(l => chartLogs.push(l));
            }
        }

        const multiChartLogs = expandedChart.type === 'multi' ? sortedLogsAsc.map(l => {
          let logObj = { date: l.date, lotNumber: l.lotNumber };
          if(activePoints) activePoints.forEach(p => {
             let rawVal = (l.values && Array.isArray(l.values)) ? l.values[p.originalIndex] : null;
             let parsed = null;
             if (rawVal !== '' && rawVal != null) { parsed = parseFloat(String(rawVal).trim().split(/[\s,\[\]]+/)[0]); }
             logObj[`point_${p.originalIndex}`] = !isNaN(parsed) && parsed !== null ? parsed : null;
          });
          return logObj;
        }) : [];

        if (expandedChart && expandedChart.type === 'multi' && activePoints) {
            const p1Orig = activePoints[expandedChart.p1] ? activePoints[expandedChart.p1].originalIndex : null;
            const p2Orig = expandedChart.p2 !== -1 && activePoints[expandedChart.p2] ? activePoints[expandedChart.p2].originalIndex : null;

            const calcTrend = (origIdx) => {
                if (origIdx === null) return;
                let sum_x=0, sum_y=0, sum_xy=0, sum_xx=0, numValid=0;
                multiChartLogs.forEach((log, i) => {
                    const val = log[`point_${origIdx}`];
                    if (val !== null && val !== undefined) { sum_x += i; sum_y += val; sum_xy += i * val; sum_xx += i * i; numValid++; }
                });
                if (numValid > 1) {
                    const m = (numValid * sum_xy - sum_x * sum_y) / (numValid * sum_xx - sum_x * sum_x);
                    const b = (sum_y - m * sum_x) / numValid;
                    multiChartLogs.forEach((log, i) => { log[`trend_${origIdx}`] = Number((m * i + b).toFixed(2)); });
                } else if (numValid === 1) {
                    const singleVal = multiChartLogs.find(l => l[`point_${origIdx}`] !== null)[`point_${origIdx}`];
                    multiChartLogs.forEach(log => { log[`trend_${origIdx}`] = singleVal; });
                }
            };
            calcTrend(p1Orig); calcTrend(p2Orig);
        }

        let zoomedLogs = chartLogs;
        if (chartZoom.left !== 'dataMin' && chartZoom.right !== 'dataMax') {
            const i1 = chartLogs.findIndex(l => l.date === chartZoom.left);
            const i2 = chartLogs.map(l => l.date).lastIndexOf(chartZoom.right);
            if (i1 !== -1 && i2 !== -1) zoomedLogs = chartLogs.slice(Math.min(i1, i2), Math.max(i1, i2) + 1);
        }

        let yMin = zoomedLogs.length > 0 ? Math.min(...zoomedLogs.map(l => l.value)) : 0;
        let yMax = zoomedLogs.length > 0 ? Math.max(...zoomedLogs.map(l => l.value)) : 100;

        const limitsAndSpecs = [];
        if (showLines.cl) limitsAndSpecs.push(cl);
        if(n > 0) { if(showLines.ucl) limitsAndSpecs.push(ucl); if(showLines.lcl) limitsAndSpecs.push(lcl); }
        if (currentPoint) {
            if (showLines.lsl && currentPoint.lsl !== '' && currentPoint.lsl !== null && !isNaN(currentPoint.lsl)) limitsAndSpecs.push(parseFloat(currentPoint.lsl));
            if (showLines.usl && currentPoint.usl !== '' && currentPoint.usl !== null && !isNaN(currentPoint.usl)) limitsAndSpecs.push(parseFloat(currentPoint.usl));
            if (showLines.target && currentPoint.target !== '' && currentPoint.target !== null && !isNaN(currentPoint.target)) limitsAndSpecs.push(parseFloat(currentPoint.target));
        }
        limitsAndSpecs.forEach(val => { if (!isNaN(val)) { if (val < yMin) yMin = val; if (val > yMax) yMax = val; } });

        const yMargin = (yMax - yMin) * 0.15 || 1;
        const yDomain = [Number((yMin - yMargin).toFixed(2)), Number((yMax + yMargin).toFixed(2))];

        return (
          <div className="fixed inset-0 bg-gray-900/80 flex items-center justify-center z-[130] backdrop-blur-sm p-4 no-print">
            <div className="bg-white rounded-2xl shadow-2xl w-full h-full max-w-7xl max-h-[90vh] flex flex-col overflow-hidden">
              <div className="flex justify-between items-center p-6 border-b shrink-0">
                <h3 className="text-2xl font-bold flex gap-2 text-gray-800">
                  {expandedChart.type === 'line' && <Fragment><Icons.TrendingUp/> SPC 관리도 확대 ({currentPoint ? currentPoint.name : ''})</Fragment>}
                  {expandedChart.type === 'cpk' && <Fragment><Icons.Activity/> 공정능력 추세 확대 ({currentPoint ? currentPoint.name : ''})</Fragment>}
                  {expandedChart.type === 'area' && <Fragment><Icons.NormalCurve/> 정규분포 확대 ({currentPoint ? currentPoint.name : ''}) {cpk > 0 && <span className="text-sm bg-indigo-100 text-indigo-700 px-2 py-1 rounded ml-2">Cpk: {cpk}</span>}</Fragment>}
                  {expandedChart.type === 'multi' && <Fragment><Icons.Layers/> 통합 관리도</Fragment>}
                </h3>
                <div className="flex items-center gap-3">
                  {(expandedChart.type === 'line' || expandedChart.type === 'cpk') && chartZoom.left !== 'dataMin' && (
                     <button onClick={handleZoomOut} className="px-3 py-1.5 bg-red-50 text-red-600 border border-red-200 rounded-lg hover:bg-red-100 font-bold text-sm shadow-sm transition-colors">Zoom 초기화</button>
                  )}
                  <button onClick={() => { setExpandedChart(null); handleZoomOut(); }} className="p-2 text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-full transition-colors"><Icons.X/></button>
                </div>
              </div>
              <div className="flex-1 p-6 flex flex-col min-h-0 bg-gray-50/50">
                {expandedChart.type === 'line' && (
                  <div className="flex-1 min-h-0 flex flex-col">
                    <div className="flex flex-wrap gap-1.5 items-center mb-3 shrink-0 bg-white px-4 py-2 rounded-xl border border-gray-200 shadow-sm">
                      <span className="text-sm font-bold text-gray-600 mr-2">기준선 표시:</span>
                      <button onClick={() => toggleSpcLine('usl')} className={`text-sm px-3 py-1 rounded-md border font-bold transition-colors ${showLines.usl ? 'bg-red-50 border-red-200 text-red-800' : 'bg-gray-50 border-gray-200 text-gray-400 hover:bg-gray-100'}`}>USL</button>
                      <button onClick={() => toggleSpcLine('target')} className={`text-sm px-3 py-1 rounded-md border font-bold transition-colors ${showLines.target ? 'bg-green-50 border-green-200 text-green-700' : 'bg-gray-50 border-gray-200 text-gray-400 hover:bg-gray-100'}`}>Target</button>
                      <button onClick={() => toggleSpcLine('lsl')} className={`text-sm px-3 py-1 rounded-md border font-bold transition-colors ${showLines.lsl ? 'bg-red-50 border-red-200 text-red-800' : 'bg-gray-50 border-gray-200 text-gray-400 hover:bg-gray-100'}`}>LSL</button>
                      <div className="w-px h-4 bg-gray-300 mx-2"></div>
                      <button onClick={() => toggleSpcLine('ucl')} className={`text-sm px-3 py-1 rounded-md border font-bold transition-colors ${showLines.ucl ? 'bg-red-50 border-red-200 text-red-600' : 'bg-gray-50 border-gray-200 text-gray-400 hover:bg-gray-100'}`}>UCL</button>
                      <button onClick={() => toggleSpcLine('cl')} className={`text-sm px-3 py-1 rounded-md border font-bold transition-colors ${showLines.cl ? 'bg-gray-200 border-gray-300 text-gray-800' : 'bg-gray-50 border-gray-200 text-gray-400 hover:bg-gray-100'}`}>CL</button>
                      <button onClick={() => toggleSpcLine('lcl')} className={`text-sm px-3 py-1 rounded-md border font-bold transition-colors ${showLines.lcl ? 'bg-red-50 border-red-200 text-red-600' : 'bg-gray-50 border-gray-200 text-gray-400 hover:bg-gray-100'}`}>LCL</button>
                    </div>
                    <div className="flex-1 min-h-0 bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                      <ResponsiveContainer width="100%" height="100%">
                        <LineChart data={zoomedLogs} margin={{right: 80}} onMouseDown={(e) => e && e.activeLabel && setChartZoom({...chartZoom, refAreaLeft: e.activeLabel})} onMouseMove={(e) => e && chartZoom.refAreaLeft && e.activeLabel && setChartZoom({...chartZoom, refAreaRight: e.activeLabel})} onMouseUp={handleZoom}>
                          <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9" vertical={false}/>
                          <XAxis dataKey="date" tick={{fontSize: 13, fill: '#64748b'}} domain={[chartZoom.left, chartZoom.right]} allowDataOverflow />
                          <YAxis domain={yDomain} tick={{fontSize: 13, fill: '#64748b'}} allowDataOverflow />
                          <Tooltip content={<CustomSpcTooltip />} />
                          <Legend verticalAlign="top" height={36} wrapperStyle={{ fontSize: '14px', fontWeight: 'bold' }}/>
                          {showLines.usl && currentPoint && currentPoint.usl && <ReferenceLine y={parseFloat(currentPoint.usl)} label={{position: 'right', value: `USL: ${currentPoint.usl}`, fill: '#991b1b', fontSize: 13, fontWeight: 'bold'}} stroke="#991b1b" strokeWidth={2} />}
                          {showLines.lsl && currentPoint && currentPoint.lsl && <ReferenceLine y={parseFloat(currentPoint.lsl)} label={{position: 'right', value: `LSL: ${currentPoint.lsl}`, fill: '#991b1b', fontSize: 13, fontWeight: 'bold'}} stroke="#991b1b" strokeWidth={2} />}
                          {showLines.target && currentPoint && currentPoint.target && <ReferenceLine y={parseFloat(currentPoint.target)} label={{position: 'insideTopLeft', value: `Target: ${currentPoint.target}`, fill: '#16a34a', fontSize: 13, fontWeight: 'bold'}} stroke="#16a34a" strokeDasharray="5 5" strokeWidth={2} />}
                          {showLines.ucl && n > 0 && <ReferenceLine y={ucl} label={{position: 'right', value: `UCL: ${ucl.toFixed(2)}`, fill: '#ef4444', fontSize: 13, fontWeight: 'bold'}} stroke="#ef4444" strokeDasharray="3 3" strokeWidth={1.5} />}
                          {showLines.lcl && n > 0 && <ReferenceLine y={lcl} label={{position: 'right', value: `LCL: ${lcl.toFixed(2)}`, fill: '#ef4444', fontSize: 13, fontWeight: 'bold'}} stroke="#ef4444" strokeDasharray="3 3" strokeWidth={1.5} />}
                          {showLines.cl && n > 0 && <ReferenceLine y={cl} label={{position: 'right', value: `CL: ${cl.toFixed(2)}`, fill: '#1e293b', fontSize: 13, fontWeight: 'bold'}} stroke="#1e293b" strokeWidth={1} />}
                          <Line type="monotone" dataKey="value" stroke="#3b82f6" strokeWidth={3} activeDot={{ r: 8 }} name="측정값" connectNulls isAnimationActive={false}/>
                          {zoomedLogs.map((log, index) => {
                             if (log.isOutlier || (currentPoint && currentPoint.usl && log.value > parseFloat(currentPoint.usl)) || (currentPoint && currentPoint.lsl && log.value < parseFloat(currentPoint.lsl))) { return <ReferenceDot key={`outlier-${index}`} x={log.date} y={log.value} r={8} fill="red" stroke="white" strokeWidth={2} shape="star" isFront={true}/> } return null;
                          })}
                          {(appSettings.trendLine === 'both' || appSettings.trendLine === 'movingAverage') && <Line type="monotone" dataKey="movingAverage" stroke="#f97316" strokeWidth={3} strokeDasharray="5 5" dot={false} name="5-MA(이동평균)" connectNulls isAnimationActive={false}/>}
                          {(appSettings.trendLine === 'both' || appSettings.trendLine === 'linear') && <Line type="monotone" dataKey="linearTrend" stroke="#a855f7" strokeWidth={3} strokeDasharray="3 3" dot={false} name="선형 추세선" connectNulls isAnimationActive={false}/>}
                          {chartZoom.refAreaLeft && chartZoom.refAreaRight && <ReferenceArea x1={chartZoom.refAreaLeft} x2={chartZoom.refAreaRight} strokeOpacity={0.3} fill="#cbd5e1" opacity={0.4} />}
                        </LineChart>
                      </ResponsiveContainer>
                    </div>
                    {renderGuide('dist')}
                  </div>
                )}
                {expandedChart.type === 'cpk' && (
                  <div className="flex-1 min-h-0 flex flex-col">
                    <div className="flex gap-2 items-center mb-3 bg-white p-3 rounded-xl border border-gray-200 shrink-0 shadow-sm">
                       <span className="text-sm font-bold text-gray-600 pl-2">Window:</span>
                       <select className="border border-gray-300 rounded outline-none text-sm px-3 py-1.5 focus:border-indigo-500 font-bold bg-white" value={movingWindow} onChange={e => setMovingWindow(parseInt(e.target.value))}><option value={10}>10 LOT</option><option value={20}>20 LOT</option><option value={30}>30 LOT</option><option value={50}>50 LOT</option></select>
                       <span className="text-gray-300 mx-2">|</span>
                       <span className="text-sm font-bold text-gray-600">보기:</span>
                       <select className="border border-gray-300 rounded outline-none text-sm px-3 py-1.5 focus:border-indigo-500 font-bold bg-white" value={cpkViewMode} onChange={e => setCpkViewMode(e.target.value)}><option value="both">모두 보기</option><option value="trend">Cpk Trend 만</option><option value="moving">Moving Cpk 만</option></select>
                    </div>
                    <div className="flex-1 min-h-0 bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                      <ResponsiveContainer width="100%" height="100%">
                        <LineChart data={zoomedLogs} margin={{right: 50}} onMouseDown={(e) => e && e.activeLabel && setChartZoom({...chartZoom, refAreaLeft: e.activeLabel})} onMouseMove={(e) => e && chartZoom.refAreaLeft && e.activeLabel && setChartZoom({...chartZoom, refAreaRight: e.activeLabel})} onMouseUp={handleZoom}>
                          <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9" vertical={false}/>
                          <XAxis dataKey="date" tick={{fontSize: 13, fill: '#64748b'}} domain={[chartZoom.left, chartZoom.right]} allowDataOverflow />
                          <YAxis domain={[0, 'auto']} tick={{fontSize: 13, fill: '#64748b'}} allowDataOverflow />
                          <Tooltip content={<CustomCpkTooltip />} />
                          <Legend verticalAlign="top" height={36} wrapperStyle={{ fontSize: '14px', fontWeight: 'bold' }}/>
                          <ReferenceLine y={1.67} label={{position: 'insideTopLeft', value: '최우수(1.67)', fill: '#16a34a', fontSize: 13, fontWeight: 'bold'}} stroke="#16a34a" strokeDasharray="3 3" />
                          <ReferenceLine y={1.33} label={{position: 'insideTopLeft', value: 'Target(1.33)', fill: '#22c55e', fontSize: 13, fontWeight: 'bold'}} stroke="#22c55e" strokeDasharray="3 3" />
                          <ReferenceLine y={1.0} label={{position: 'insideBottomLeft', value: '경고(1.0)', fill: '#f97316', fontSize: 13, fontWeight: 'bold'}} stroke="#f97316" strokeDasharray="3 3" />
                          {(cpkViewMode === 'both' || cpkViewMode === 'trend') && <Line type="monotone" dataKey="mCpk" stroke="#6366f1" strokeWidth={3} dot={{r:3, fill:"#6366f1"}} activeDot={{ r: 8 }} name="Cpk Trend (단기)" connectNulls isAnimationActive={false}/>}
                          {(cpkViewMode === 'both' || cpkViewMode === 'moving') && <Line type="monotone" dataKey="movingCpk" stroke="#ec4899" strokeWidth={4} dot={{r:4, fill:"#ec4899"}} activeDot={{ r: 8 }} name={`Moving Cpk (${movingWindow} LOT)`} connectNulls isAnimationActive={false}/>}
                          {chartZoom.refAreaLeft && chartZoom.refAreaRight && <ReferenceArea x1={chartZoom.refAreaLeft} x2={chartZoom.refAreaRight} strokeOpacity={0.3} fill="#cbd5e1" opacity={0.4} />}
                        </LineChart>
                      </ResponsiveContainer>
                    </div>
                  </div>
                )}
                {expandedChart.type === 'area' && (
                  <div className="flex-1 min-h-0 bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                    <ResponsiveContainer width="100%" height="100%">
                      <AreaChart data={distData} margin={{right: 50}}>
                        <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9" vertical={false}/>
                        <XAxis dataKey="x" type="number" domain={['dataMin', 'dataMax']} tick={{fontSize: 13, fill: '#64748b'}} tickFormatter={(val) => val.toFixed(2)} />
                        <YAxis hide={true} />
                        <Tooltip labelFormatter={(val) => `측정값: ${Number(val).toFixed(2)}`} formatter={(val) => [Number(val).toFixed(4), '확률밀도']} />
                        {currentPoint && currentPoint.usl && <ReferenceLine x={parseFloat(currentPoint.usl)} label={{position: 'insideTopLeft', value: `USL: ${currentPoint.usl}`, fill: '#991b1b', fontSize: 14, fontWeight: 'bold'}} stroke="#991b1b" strokeDasharray="3 3" />}
                        {currentPoint && currentPoint.lsl && <ReferenceLine x={parseFloat(currentPoint.lsl)} label={{position: 'insideTopRight', value: `LSL: ${currentPoint.lsl}`, fill: '#991b1b', fontSize: 14, fontWeight: 'bold'}} stroke="#991b1b" strokeDasharray="3 3" />}
                        {currentPoint && currentPoint.target && <ReferenceLine x={parseFloat(currentPoint.target)} label={{position: 'insideTopLeft', value: `Target: ${currentPoint.target}`, fill: '#16a34a', fontSize: 14, fontWeight: 'bold'}} stroke="#16a34a" strokeDasharray="5 5" />}
                        {stats && <ReferenceLine x={stats.mean} label={{position: 'insideBottomRight', value: `CL: ${stats.mean.toFixed(2)}`, fill: '#1e293b', fontSize: 14, fontWeight: 'bold'}} stroke="#1e293b" strokeDasharray="3 3" />}
                        <Area type="monotone" dataKey="y" stroke="#6366f1" fill="#818cf8" fillOpacity={0.4} name="확률밀도" isAnimationActive={false}/>
                      </AreaChart>
                    </ResponsiveContainer>
                  </div>
                )}
                {expandedChart.type === 'multi' && activePoints && (
                  <Fragment>
                    <div className="flex flex-wrap gap-6 mb-4 p-4 bg-white rounded-xl border border-gray-200 shrink-0 shadow-sm">
                      <div className="flex items-center gap-3">
                        <label className="text-sm font-bold text-gray-700">📈 좌측 축 (기본):</label>
                        <select className="border border-gray-300 rounded-lg p-2 text-sm outline-none focus:border-indigo-500 font-bold bg-gray-50 text-indigo-700" value={expandedChart.p1} onChange={(e) => setExpandedChart({ ...expandedChart, p1: parseInt(e.target.value) })}>
                          {activePoints.map((p, idx) => <option key={idx} value={idx}>{p.name}</option>)}
                        </select>
                      </div>
                      <div className="flex items-center gap-3">
                        <label className="text-sm font-bold text-gray-700">📈 우측 보조축:</label>
                        <select className="border border-gray-300 rounded-lg p-2 text-sm outline-none focus:border-red-500 font-bold bg-gray-50 text-red-600" value={expandedChart.p2} onChange={(e) => setExpandedChart({ ...expandedChart, p2: parseInt(e.target.value) })}>
                          <option value={-1}>-- 선택 안 함 --</option>
                          {activePoints.map((p, idx) => <option key={idx} value={idx}>{p.name}</option>)}
                        </select>
                      </div>
                    </div>

                    <div className="flex-1 min-h-0 bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                      <ResponsiveContainer width="100%" height="100%">
                        <ComposedChart data={multiChartLogs}>
                          <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9" vertical={false} />
                          <XAxis dataKey="date" tick={{fontSize: 13, fill: '#64748b'}} />
                          {activePoints[expandedChart.p1] && <YAxis yAxisId="left" orientation="left" tick={{fontSize: 13, fill: '#3b82f6'}} stroke="#3b82f6" domain={['auto', 'auto']} />}
                          {expandedChart.p2 !== -1 && activePoints[expandedChart.p2] && <YAxis yAxisId="right" orientation="right" tick={{fontSize: 13, fill: '#ef4444'}} stroke="#ef4444" domain={['auto', 'auto']} />}
                          <Tooltip content={<CustomCpkTooltip />} />
                          <Legend verticalAlign="top" height={36} wrapperStyle={{ fontSize: '14px', fontWeight: 'bold' }}/>
                          {activePoints[expandedChart.p1] && <Line yAxisId="left" type="monotone" dataKey={`point_${activePoints[expandedChart.p1].originalIndex}`} name={`${activePoints[expandedChart.p1].name} (좌측 축)`} stroke="#3b82f6" strokeWidth={3} activeDot={{ r: 8 }} connectNulls isAnimationActive={false}/>}
                          {expandedChart.p2 !== -1 && activePoints[expandedChart.p2] && <Line yAxisId="right" type="monotone" dataKey={`point_${activePoints[expandedChart.p2].originalIndex}`} name={`${activePoints[expandedChart.p2].name} (우측 축)`} stroke="#ef4444" strokeWidth={3} activeDot={{ r: 8 }} connectNulls isAnimationActive={false}/>}
                          {activePoints[expandedChart.p1] && <Line yAxisId="left" type="monotone" dataKey={`trend_${activePoints[expandedChart.p1].originalIndex}`} name={`${activePoints[expandedChart.p1].name} 선형 추세선 (좌측)`} stroke="#8b5cf6" strokeWidth={2} strokeDasharray="4 4" dot={false} connectNulls isAnimationActive={false}/>}
                          {expandedChart.p2 !== -1 && activePoints[expandedChart.p2] && <Line yAxisId="right" type="monotone" dataKey={`trend_${activePoints[expandedChart.p2].originalIndex}`} name={`${activePoints[expandedChart.p2].name} 선형 추세선 (우측)`} stroke="#f59e0b" strokeWidth={2} strokeDasharray="4 4" dot={false} connectNulls isAnimationActive={false}/>}
                        </ComposedChart>
                      </ResponsiveContainer>
                    </div>
                  </Fragment>
                )}
              </div>
            </div>
          </div>
        );
      };

      // 사진 뷰어 렌더링
      const renderImageViewer = () => {
          if (!imageViewerState.isOpen || imageViewerState.images.length === 0) return null;
          const currentImg = imageViewerState.images[imageViewerState.currentIndex];
          return (
              <div className="fixed inset-0 bg-gray-900/95 flex flex-col items-center justify-center z-[200] backdrop-blur-md transition-opacity duration-300 no-print" onClick={closeImageViewer}>
                  <button className="absolute top-6 right-6 text-white hover:text-red-400 z-50 p-2 bg-black/30 rounded-full transition-colors" onClick={closeImageViewer} title="닫기 (ESC)">
                      <Icons.X />
                  </button>
                  <div className="relative w-full max-w-5xl max-h-[85vh] flex flex-col items-center justify-center p-4 animate-in zoom-in-95" onClick={e => e.stopPropagation()}>
                      <img src={`./images/${currentImg.name}`} alt={currentImg.name} className="max-w-full max-h-[75vh] object-contain rounded-lg shadow-2xl ring-1 ring-white/20" />

                      <div className="text-white mt-6 font-bold bg-black/60 px-6 py-2.5 rounded-full flex items-center gap-6 shadow-xl border border-white/10">
                         {imageViewerState.images.length > 1 ? (
                             <button onClick={prevImage} className="p-2 hover:bg-white/20 rounded-full transition-colors flex items-center justify-center text-white"><Icons.ChevronLeft/></button>
                         ) : <div className="w-10"></div>}
                         <span className="text-sm tracking-wide">사진 {imageViewerState.currentIndex + 1} <span className="text-gray-400">/</span> {imageViewerState.images.length}</span>
                         {imageViewerState.images.length > 1 ? (
                             <button onClick={nextImage} className="p-2 hover:bg-white/20 rounded-full transition-colors flex items-center justify-center text-white"><Icons.ChevronRight/></button>
                         ) : <div className="w-10"></div>}
                      </div>
                  </div>
              </div>
          );
      };

      const renderTopSyncPanel = () => (
        <div className="bg-white/95 backdrop-blur-sm p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row items-center justify-between gap-4 no-print relative z-10">
          <div className="flex items-center gap-4 w-full md:w-auto">
            <img src="SP SAMHWA CI_Orange_가로형(웹용)_jpg.jpg" alt="SP SAMHWA" className="h-7 md:h-9 object-contain ml-1 mr-1" onError={(e) => { e.target.style.display = 'none'; document.getElementById('fallback-logo').style.display = 'block'; }} />
            <span id="fallback-logo" className="hidden font-black text-2xl tracking-tighter ml-1 mr-1" style={{color: '#ff5a00'}}>SP SAMHWA</span>
            <div className="hidden md:block w-px h-6 bg-gray-200"></div>

            <div className={`p-3 rounded-full ${isConnected ? 'bg-indigo-100 text-indigo-700' : 'bg-gray-100 text-gray-400'}`}><Icons.HardDrive/></div>
            <div className="flex-1">
              <div className="font-bold flex items-center gap-2">사내 네트워크 (PlugDisk3)
                {!isConnected ? <span className="px-2 py-0.5 rounded text-xs bg-gray-200 text-gray-600">미연결</span> : lockInfo.isEditing ? (canEdit ? <span className="px-2 py-0.5 rounded text-xs bg-green-100 text-green-700 font-bold flex items-center gap-1"><Icons.Unlock/> 내 편집 모드</span> : <span className="px-2 py-0.5 rounded text-xs bg-red-100 text-red-700 font-bold flex items-center gap-1"><Icons.Lock/> {lockInfo.editorName}님 편집중</span>) : <span className="px-2 py-0.5 rounded text-xs bg-indigo-100 text-indigo-700 font-bold">대기 중</span>}
              </div>
              <div className="text-sm mt-1 flex items-center gap-2">
                <input type="text" placeholder="접속자 이름 입력" className="border px-2 py-1 rounded text-sm w-32 outline-none focus:border-indigo-500" value={userName} onChange={handleNameChange} disabled={isConnected} />
                {!isConnected && <button onClick={connectToDisk} className="text-xs bg-gray-800 text-white px-3 py-1.5 rounded hover:bg-gray-700">파일 연결</button>}
              </div>
            </div>
          </div>
          {isConnected && (
            <div className="flex items-center gap-2 w-full md:w-auto justify-end">
               {!lockInfo.isEditing && <button onClick={startEditing} className="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-indigo-700 flex items-center gap-2 shadow-sm"><Icons.Unlock/> 편집 권한 획득</button>}
               {lockInfo.isEditing && canEdit && <button onClick={() => saveAndUnlock(entries)} className="bg-green-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-green-700 flex items-center gap-2 shadow-sm"><Icons.Save/> 저장 및 잠금 해제</button>}
               {lockInfo.isEditing && !canEdit && <button onClick={forceSave} className="text-xs text-red-500 underline hover:text-red-600">강제 초기화</button>}
               <button onClick={handleRefresh} className="text-xs text-gray-500 underline ml-2 hover:text-gray-700">새로고침</button>
            </div>
          )}
        </div>
      );

      const renderTopLevelContent = () => {
        if (view === 'settings') return renderSettings();
        if (view === 'history') return renderHistoryView();
        return (
          <Fragment>
            {renderTopSyncPanel()}
            {view === 'dashboard' && renderDashboard()}
            {view === 'details' && renderDetails()}
            {view === 'form' && renderForm()}
          </Fragment>
        );
      };

      return (
        <div className="min-h-screen p-4 md:p-8 relative z-0">
          <div className="fixed inset-0 pointer-events-none -z-10 bg-slate-50 overflow-hidden">
             <div className="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-orange-500/10 blur-[100px]"></div>
             <div className="absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-indigo-500/5 blur-[120px]"></div>
             <div className="absolute inset-0 opacity-[0.03]" style={{ backgroundImage: `url("data:image/svg+xml,%3Csvg width='52' height='30' viewBox='0 0 52 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23000000' fill-opacity='1'%3E%3Cpath d='M26 0l26 15-26 15L0 15 26 0zm0 2l-22.5 13L26 28l22.5-13L26 2z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")`, backgroundSize: '60px' }}></div>
             <div className="absolute bottom-10 right-10 opacity-5">
                <img src="SP SAMHWA CI_Orange_가로형(웹용)_jpg.jpg" alt="SP SAMHWA Watermark" className="w-[300px] md:w-[600px] object-contain grayscale" onError={(e) => e.target.style.display = 'none'} />
             </div>
          </div>

          {toastMsg && <div className="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl z-50 flex items-center gap-2 font-medium animate-bounce no-print"><Icons.CheckCircle/> {toastMsg}</div>}

          {modalConfig.type && !['ai_analysis', 'ai_analysis_result'].includes(modalConfig.type) && (
            <div className="fixed inset-0 bg-gray-900/50 flex items-center justify-center z-[150] backdrop-blur-sm no-print">
              <div className="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full mx-4 border border-gray-100">
                <h3 className="text-lg font-bold text-gray-900 mb-4">{modalConfig.type === 'info' ? '알림' : '시스템 확인'}</h3>
                <p className="text-sm text-gray-600 mb-6 leading-relaxed whitespace-pre-wrap">{modalConfig.message}</p>
                <div className="flex gap-2 justify-end">
                  {modalConfig.type === 'confirm' && <button onClick={() => setModalConfig({ type: null })} className="px-4 py-2 text-gray-600 bg-gray-100 rounded-lg font-bold hover:bg-gray-200">취소</button>}
                  <button onClick={modalConfig.type === 'confirm' ? modalConfig.onConfirm : () => setModalConfig({ type: null })} className="px-4 py-2 bg-indigo-600 text-white rounded-lg font-bold hover:bg-indigo-700">확인</button>
                </div>
              </div>
            </div>
          )}

          {modalConfig.type === 'ai_analysis' && (
             <div className="fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center z-[130] p-4 no-print">
               <div className="bg-white p-8 rounded-2xl shadow-2xl flex flex-col items-center justify-center text-center">
                 <div className="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                 <h3 className="font-extrabold text-lg text-indigo-800">스마트 공정 진단 중...</h3>
                 <p className="text-gray-500 mt-2 text-sm">데이터의 추세와 산포를 기반으로 공정 상태를 해석하고 있습니다.</p>
               </div>
             </div>
          )}
          {modalConfig.type === 'ai_analysis_result' && (
             <div className="fixed inset-0 bg-gray-900/70 backdrop-blur-sm flex items-center justify-center z-[130] p-4 no-print">
               <div className="bg-gradient-to-b from-gray-900 to-gray-800 p-6 rounded-2xl shadow-2xl w-full max-w-3xl max-h-[85vh] flex flex-col border border-gray-700 animate-in fade-in zoom-in">
                 <div className="flex justify-between items-center mb-4 border-b border-gray-700 pb-4 shrink-0">
                   <h3 className="font-extrabold text-lg text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400 flex items-center gap-2"><Icons.Sparkles/> 스마트 공정 진단 리포트</h3>
                   <button onClick={() => setModalConfig({type: null})} className="text-gray-400 hover:text-gray-200 text-2xl">&times;</button>
                 </div>
                 <div className="flex-1 overflow-y-auto pr-2 text-gray-200">
                    <div className="whitespace-pre-wrap text-sm leading-relaxed bg-gray-800/50 p-5 rounded-xl border border-gray-600/50 shadow-inner font-mono">{modalConfig.message}</div>
                 </div>
                 <div className="mt-6 pt-4 flex justify-end gap-3 shrink-0">
                    <button onClick={() => { saveCurrentAiReport(); setModalConfig({type: null}); }} className="px-6 py-2.5 bg-gray-700 text-white font-bold rounded-lg hover:bg-gray-600 shadow">진단 이력 저장</button>
                    <button onClick={() => setModalConfig({type: null})} className="px-6 py-2.5 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-500 transition-colors shadow">확인 완료</button>
                 </div>
               </div>
             </div>
          )}

          {renderAddPointModal()}
          {renderExpandedChartModal()}
          {renderCompareModal()}
          {renderExcelModal()}
          {renderImageViewer()}

          <div className="max-w-7xl mx-auto">
            {renderTopLevelContent()}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<QualityHistoryApp/>);
  </script>
</body>
</html>
