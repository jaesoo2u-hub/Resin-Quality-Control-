                    <label className="flex justify-between text-sm font-bold text-gray-700 mb-1"><span>연속 런(Run) 경고 기준</span><span className="text-indigo-600">{appSettings.runRule}회</span></label>
                    <input type="range" min="3" max="7" step="1" className="w-full accent-indigo-600" value={appSettings.runRule} onChange={e => updateAppSetting('runRule', parseInt(e.target.value))} />
                  </div>
                  <div>
                    <label className="flex justify-between text-sm font-bold text-gray-700 mb-1"><span>Warning Margin 기준</span><span className="text-indigo-600">{appSettings.warningMargin}%</span></label>
                    <input type="range" min="5" max="30" step="5" className="w-full accent-indigo-600" value={appSettings.warningMargin} onChange={e => updateAppSetting('warningMargin', parseInt(e.target.value))} />
                  </div>
                  <div>
                    <label className="flex justify-between text-sm font-bold text-gray-700 mb-1"><span>Critical Margin 기준</span><span className="text-red-600">{appSettings.criticalMargin}%</span></label>
                    <input type="range" min="1" max="15" step="1" className="w-full accent-red-600" value={appSettings.criticalMargin} onChange={e => updateAppSetting('criticalMargin', parseInt(e.target.value))} />
                  </div>
                  <div className="flex justify-between items-center mt-2">
                    <label className="text-sm font-bold text-gray-700">추세 계산 Batch 수</label>
                    <select className="border border-gray-300 rounded p-1.5 text-sm" value={appSettings.trendBatchCount || 5} onChange={e => updateAppSetting('trendBatchCount', parseInt(e.target.value))}>
                      <option value="3">3 Batch</option><option value="5">5 Batch (권장)</option><option value="10">10 Batch</option>
                    </select>
                  </div>
                  <div className="flex justify-between items-center">
                    <label className="text-sm font-bold text-gray-700">R² 신뢰도 최소 기준</label>
                    <select className="border border-gray-300 rounded p-1.5 text-sm" value={appSettings.r2Threshold || 0.4} onChange={e => updateAppSetting('r2Threshold', parseFloat(e.target.value))}>
                      <option value="0.3">0.3</option><option value="0.4">0.4 (권장)</option><option value="0.5">0.5</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <div className="space-y-6">
              <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h3 className="font-bold text-lg mb-2 text-indigo-700 flex items-center gap-2"><span className="material-symbols-outlined">person_add</span> 작성자(검사원) 관리</h3>
                <div className="flex gap-2 mb-4">
                  <input type="text" className="border border-gray-300 p-2 flex-1 rounded text-sm outline-none focus:border-indigo-500" placeholder="새 작성자 이름" value={newAuthorInput} onChange={e => setNewAuthorInput(e.target.value)} onKeyDown={e => { if(e.key==='Enter' && newAuthorInput.trim() && !authors.includes(newAuthorInput.trim())) { const updated = [...authors, newAuthorInput.trim()]; setAuthors(updated); localStorage.setItem('qualityAppAuthors', JSON.stringify(updated)); setNewAuthorInput(''); } }} />
                  <button onClick={() => { if(newAuthorInput.trim() && !authors.includes(newAuthorInput.trim())) { const updated = [...authors, newAuthorInput.trim()]; setAuthors(updated); localStorage.setItem('qualityAppAuthors', JSON.stringify(updated)); setNewAuthorInput(''); } }} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 rounded text-sm font-bold">추가</button>
                </div>
                <div className="flex flex-wrap gap-2">
                  {authors.map((author, idx) => (
                    <span key={idx} className="bg-gray-100 px-3 py-1.5 rounded-full text-sm font-bold flex items-center gap-2 text-gray-700">
                      {author} <button onClick={() => { const up = authors.filter((_,i)=>i!==idx); setAuthors(up); localStorage.setItem('qualityAppAuthors', JSON.stringify(up)); }} className="text-gray-400 hover:text-red-500"><Icons.X/></button>
                    </span>
                  ))}
                </div>
              </div>


              <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mt-6 mb-6">
                <div className="flex justify-between items-center mb-4">
                    <h3 className="font-bold text-lg text-indigo-700 flex items-center gap-2"><Icons.History/> Audit Log (감사 로그)</h3>
                    <span className="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">총 {auditLogs.length}건 기록</span>
                </div>
                <div className="max-h-60 overflow-y-auto border border-gray-200 rounded-lg bg-gray-50 p-2">
                  {auditLogs.length === 0 ? (
                    <div className="text-center text-sm text-gray-500 py-10">기록된 작업이 없습니다.</div>
                  ) : (
                    <div className="space-y-2">
                      {auditLogs.map((log) => (
                        <div key={log.id} className="bg-white p-3 rounded shadow-sm border border-gray-100 text-xs">
                          <div className="flex justify-between items-center mb-1 border-b pb-1">
                            <span className="font-bold text-indigo-600">{log.action}</span>
                            <span className="text-gray-400">{new Date(log.timestamp).toLocaleString()}</span>
                          </div>
                          <div className="grid grid-cols-2 gap-2 text-gray-600">
                            <div><span className="font-bold">User:</span> {log.userName}</div>
                            <div className="truncate"><span className="font-bold">Client:</span> {log.clientId}</div>
                            {log.productName && <div><span className="font-bold">제품:</span> {log.productName}</div>}
                            {log.lotNumber && <div><span className="font-bold">LOT:</span> {log.lotNumber}</div>}
                          </div>
                          {log.beforeData && (
                            <div className="mt-2 p-1.5 bg-red-50 rounded text-red-700 max-h-16 overflow-y-auto whitespace-pre-wrap">
                              <span className="font-bold">변경 전:</span> {JSON.stringify(log.beforeData)}
                            </div>
                          )}
                          {log.afterData && (
                            <div className="mt-1 p-1.5 bg-blue-50 rounded text-blue-700 max-h-16 overflow-y-auto whitespace-pre-wrap">
                              <span className="font-bold">변경 후:</span> {JSON.stringify(log.afterData)}
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>

              <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mt-6 mb-6">
                <h3 className="font-bold text-lg mb-4 text-indigo-700 flex items-center gap-2"><span className="material-symbols-outlined">book</span> 품질관리 용어 가이드 편집</h3>
                <div className="space-y-3 max-h-64 overflow-y-auto border border-gray-200 rounded-lg p-3 bg-gray-50">
                  {qualityAppTerms.sort((a,b)=>a.order-b.order).map((term, i) => (
                    <div key={term.name} className="bg-white p-3 rounded shadow-sm border border-gray-100">
                      <div className="flex justify-between items-center mb-2">
                        <div className="font-bold text-indigo-800">{term.name} <span className="text-xs font-normal text-gray-500 bg-gray-100 px-1 rounded ml-1">{term.category}</span></div>
                        <div className="flex items-center gap-2">
                           <label className="text-xs flex items-center gap-1 cursor-pointer">
                             <input type="checkbox" checked={term.isVisible} onChange={(e) => {
                               const newTerms = [...qualityAppTerms]; newTerms[i].isVisible = e.target.checked; setQualityAppTerms(newTerms);
                             }} className="accent-indigo-600" /> 표시
                           </label>
                           <input type="number" className="w-12 border p-1 text-xs rounded" value={term.order} onChange={(e) => {
                               const newTerms = [...qualityAppTerms]; newTerms[i].order = parseInt(e.target.value) || 0; setQualityAppTerms(newTerms);
                           }} title="정렬 순서" />
                        </div>
                      </div>
                      <textarea className="w-full text-xs border p-2 rounded h-20 outline-none focus:ring-1 focus:ring-indigo-500" value={term.definition} onChange={(e) => {
                          const newTerms = [...qualityAppTerms]; newTerms[i].definition = e.target.value; setQualityAppTerms(newTerms);
                      }} />
                    </div>
                  ))}
                </div>
              </div>
<div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col gap-4">
                <h3 className="font-bold text-lg text-gray-800 flex items-center gap-2"><span className="material-symbols-outlined">save</span> 데이터 백업 및 복원</h3>
                <p className="text-xs text-gray-500">현재 입력된 모든 데이터, 설정, 프로파일, 이력을 백업하거나 기존 백업 파일을 복원합니다.</p>
                <div className="flex gap-2">
                    <button onClick={exportDataJSON} className="flex-1 py-3 bg-gray-800 hover:bg-gray-900 text-white rounded-lg font-bold flex items-center justify-center gap-2 text-sm shadow">
                      <Icons.HardDrive/> 백업 다운로드
                    </button>
                    <input type="file" accept=".json" id="import-json" className="hidden" onChange={importDataJSON} />
                    <button onClick={() => document.getElementById('import-json').click()} className="flex-1 py-3 bg-indigo-50 border border-indigo-200 text-indigo-700 hover:bg-indigo-100 rounded-lg font-bold flex items-center justify-center gap-2 text-sm shadow-sm">
                      <Icons.Upload/> 백업 복원
                    </button>
                </div>
              </div>
            </div>

            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 md:col-span-2">
               <h3 className="font-bold text-lg mb-4 text-indigo-700 flex items-center gap-2"><Icons.Layers/> 제품 프로파일 관리</h3>
               <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                 <div className="md:col-span-1 border-r border-gray-100 pr-4 space-y-4">
                   <h4 className="font-bold text-sm text-gray-700">신규 프로파일 등록</h4>
                   <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">제품명 (Grade)</label>
                      <input type="text" className="w-full border p-2 rounded outline-none focus:border-indigo-500" value={newProfileForm.name} onChange={e=>setNewProfileForm({...newProfileForm, name: e.target.value})} placeholder="예: KPE-424-65" />
                   </div>
                   <div className="grid grid-cols-2 gap-2">
                      <div><label className="block text-xs font-bold text-gray-500 mb-1">Warning Margin (%)</label><input type="number" className="w-full border p-2 rounded text-sm" value={newProfileForm.warningMargin || 15} onChange={e=>setNewProfileForm({...newProfileForm, warningMargin: Number(e.target.value)})} /></div>
                      <div><label className="block text-xs font-bold text-gray-500 mb-1">Critical Margin (%)</label><input type="number" className="w-full border p-2 rounded text-sm" value={newProfileForm.criticalMargin || 5} onChange={e=>setNewProfileForm({...newProfileForm, criticalMargin: Number(e.target.value)})} /></div>
                   </div>
                   <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">관리 유형</label>
                      <select className="w-full border p-2 rounded text-sm outline-none bg-white" value={newProfileForm.profile} onChange={e=>setNewProfileForm({...newProfileForm, profile: e.target.value})}>
                         <option>Target 중심 관리형</option><option>규격 중심 관리형</option><option>운전 보정형</option><option>Batch Drift 허용형</option><option>산포 관리형</option>
                      </select>
                   </div>
                   <button onClick={() => {
                       if(!newProfileForm.name) return showToast('제품명을 입력하세요.');
                       const isDup = productProfiles.find(p=>p.name===newProfileForm.name);
                       let up = [];
                       if(isDup) { up = productProfiles.map(p=>p.name===newProfileForm.name ? {...newProfileForm, id:p.id} : p); showToast('수정되었습니다.'); }
                       else { up = [...productProfiles, {...newProfileForm, id:Date.now()}]; showToast('추가되었습니다.'); }
                       setProductProfiles(up); localStorage.setItem('qualityAppProfiles', JSON.stringify(up));
                   }} className="w-full bg-indigo-600 text-white font-bold py-2 rounded hover:bg-indigo-700">저장</button>
                 </div>

                 <div className="md:col-span-2">
                   <h4 className="font-bold text-sm text-gray-700 mb-4">등록된 프로파일 목록</h4>
                   <div className="space-y-2 h-64 overflow-y-auto pr-2">
                      {productProfiles.map(p => (
                         <div key={p.id} className="flex justify-between items-center p-3 border border-gray-200 rounded-lg bg-gray-50 hover:bg-indigo-50 cursor-pointer" onClick={() => setNewProfileForm(p)}>
                            <div>
                               <p className="font-extrabold text-indigo-900">{p.name}</p>
                               <p className="text-xs text-gray-600">{p.profile} | Warning: {p.warningMargin}% | Critical: {p.criticalMargin}%</p>
                            </div>
                            <button onClick={(e) => { e.stopPropagation(); const up = productProfiles.filter(x=>x.id!==p.id); setProductProfiles(up); localStorage.setItem('qualityAppProfiles', JSON.stringify(up)); }} className="text-gray-400 hover:text-red-500 p-2"><Icons.Trash2/></button>
                         </div>
                      ))}
                      {productProfiles.length === 0 && <div className="text-sm text-center text-gray-400 py-10">등록된 프로파일이 없습니다.</div>}
                   </div>
                 </div>
               </div>
            </div>
          </div>
        </div>
      );

      const renderCompareModal = () => {
         if (!showCompareModal) return null;
         const { past, current } = compareSelection;

         const getDelta = (val1, val2, inverse = false) => {
            const v1 = parseFloat(val1) || 0; const v2 = parseFloat(val2) || 0;
            if(isNaN(v1) || isNaN(v2)) return <span className="text-gray-400 text-xs font-bold ml-2">-</span>;
            const diff = v2 - v1;
            if(diff > 0) return <span className={`${inverse ? 'text-red-600' : 'text-green-600'} text-xs font-bold ml-2`}>▲ {diff.toFixed(2)}</span>;
            if(diff < 0) return <span className={`${inverse ? 'text-green-600' : 'text-red-600'} text-xs font-bold ml-2`}>▼ {Math.abs(diff).toFixed(2)}</span>;
            return <span className="text-gray-400 text-xs font-bold ml-2">-</span>;
         };

         return (
            <div className="fixed inset-0 bg-gray-900/70 z-[200] flex items-center justify-center p-4 backdrop-blur-sm">
                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col border border-gray-100">
                    <div className="flex justify-between items-center p-5 border-b bg-gray-50">
                        <h2 className="text-xl font-bold flex items-center gap-2"><Icons.Activity/> AI 공정 분석 이력 비교</h2>
                        <button onClick={() => setShowCompareModal(false)} className="text-gray-500 hover:text-gray-800"><Icons.X/></button>
                    </div>
                    <div className="p-6 flex-1 overflow-y-auto">
                        {(!past || !current) ? (
                            <div className="text-center py-10 text-gray-500">비교할 대상(과거, 최신)을 선택해주세요.</div>
                        ) : (
                            <div className="grid grid-cols-3 gap-0 border border-gray-200 rounded-lg overflow-hidden">
                                <div className="col-span-1 bg-gray-100 p-4 border-r border-b font-bold text-gray-700 text-center">항목</div>
                                <div className="col-span-1 bg-blue-50 p-4 border-r border-b font-bold text-blue-900 text-center">과거 분석 ({past.date})</div>
                                <div className="col-span-1 bg-indigo-50 p-4 border-b font-bold text-indigo-900 text-center">최신 분석 ({current.date})</div>

                                <div className="col-span-1 bg-gray-50 p-4 border-r border-b font-medium text-sm text-gray-700">제품 및 항목</div>
                                <div className="col-span-1 p-4 border-r border-b bg-white text-center font-bold">{past.grade} - {past.point}</div>
                                <div className="col-span-1 p-4 border-b bg-white text-center font-bold">{current.grade} - {current.point}</div>

                                <div className="col-span-1 bg-gray-50 p-4 border-r border-b font-medium text-sm text-gray-700">AI 판정 상태</div>
                                <div className="col-span-1 p-4 border-r border-b bg-white text-center font-bold text-sm">{past.status}</div>
                                <div className="col-span-1 p-4 border-b bg-white text-center font-bold text-sm">{current.status}</div>

                                <div className="col-span-1 bg-gray-50 p-4 border-r border-b font-medium text-sm text-gray-700">공정능력 (Cpk)</div>
                                <div className="col-span-1 p-4 border-r border-b bg-white text-center font-bold">{past.cpk > 0 ? past.cpk : '-'}</div>
                                <div className="col-span-1 p-4 border-b bg-white text-center font-bold">{current.cpk > 0 ? current.cpk : '-'}{getDelta(past.cpk, current.cpk, false)}</div>

                                <div className="col-span-1 bg-gray-50 p-4 border-r border-b font-medium text-sm text-gray-700">안정도 (PSI)</div>
                                <div className="col-span-1 p-4 border-r border-b bg-white text-center font-bold">{past.psi}점</div>
                                <div className="col-span-1 p-4 border-b bg-white text-center font-bold">{current.psi}점{getDelta(past.psi, current.psi, false)}</div>

                                <div className="col-span-1 bg-gray-50 p-4 border-r border-b font-medium text-sm text-gray-700">산포 (Sigma) 증감률</div>
                                <div className="col-span-1 p-4 border-r border-b bg-white text-center font-bold">{past.trend}</div>
                                <div className="col-span-1 p-4 border-b bg-white text-center font-bold">{current.trend}</div>

                                <div className="col-span-3 bg-gray-100 p-3 font-bold text-center border-b">AI 결론 비교</div>
                                <div className="col-span-1 bg-gray-50 p-4 border-r font-medium text-sm text-gray-700">요약</div>
                                <div className="col-span-1 p-4 border-r bg-white text-xs whitespace-pre-wrap leading-relaxed">{past.conclusion}</div>
                                <div className="col-span-1 p-4 bg-white text-xs whitespace-pre-wrap leading-relaxed">{current.conclusion}</div>
                            </div>
                        )}
                    </div>
                </div>
            </div>
         );
      };

      const [newEntry, setNewEntry] = useState({
        resinName: '', type: '부적합 대책', processProfile: 'Target 중심 관리형', cause: '', startDate: new Date().toISOString().split('T')[0], endDate: '',
        points: [{ name: '', lsl: '', target: '', usl: '' }, { name: '', lsl: '', target: '', usl: '' }]
      });
      const [newLog, setNewLog] = useState({ date: new Date().toISOString().split('T')[0], lotNumber: '', values: ['', '', '', '', ''], content: '', images: [] });

      const handlePointChange = (idx, field, val) => { const up = [...newEntry.points]; up[idx][field] = val; setNewEntry({ ...newEntry, points: up }); };
      const handleLogValueChange = (idx, val) => { const uv = [...newLog.values]; uv[idx] = val; setNewLog({ ...newLog, values: uv }); };
      const handleAddPoint = () => { if (newEntry.points.length >= 10) return; setNewEntry({ ...newEntry, points: [...newEntry.points, { name: '', lsl: '', target: '', usl: '' }] }); };
      const handleRemovePoint = (idxToRemove) => { if (newEntry.points.length <= 1) return; setNewEntry({ ...newEntry, points: newEntry.points.filter((_, i) => i !== idxToRemove) }); };

      useEffect(() => {
          if (view === 'form' && newEntry.resinName) {
             const matched = productProfiles.find(p => p.name === newEntry.resinName);
             if (matched && newEntry.processProfile !== matched.profile) {
                 setNewEntry(prev => ({...prev, processProfile: matched.profile}));
                 showToast(`${matched.name} 프로파일이 자동 적용되었습니다.`);
             }
          }
      }, [newEntry.resinName, view, productProfiles]);

      const handleCreate = () => {
        if (!newEntry.resinName || !newEntry.cause || !newEntry.points.some(p => p.name.trim() !== '')) return;
        const entry = { ...newEntry, id: Date.now(), status: '진행중', logs: [] };
        updateAndSync([entry, ...entries], 'CREATE', { productName: entry.resinName, recordId: entry.id, afterData: entry }); setView('dashboard');
        setNewEntry({ resinName: '', type: '부적합 대책', processProfile: appSettings.defaultProfile, cause: '', startDate: new Date().toISOString().split('T')[0], endDate: '', points: [{ name: '', lsl: '', target: '', usl: '' }, { name: '', lsl: '', target: '', usl: '' }] });
      };

      const handleAddLog = () => {
        if (newLog.values.every(v => v === '') && !newLog.content && (!newLog.images || newLog.images.length === 0)) { setModalConfig({ type: 'info', message: '최소 1개의 측정값, 내용 또는 사진을 등록하세요.' }); return; }
        const newLogWithEditor = { ...newLog, id: Date.now(), editorName: logEditorName || userName };
        const curEntry = entries.find(e => e.id === selectedId); updateAndSync(entries.map(entry => entry.id === selectedId ? { ...entry, logs: [...entry.logs, newLogWithEditor] } : entry), 'UPDATE', { productName: curEntry?.resinName, recordId: curEntry?.id, lotNumber: newLogWithEditor.lotNumber, afterData: newLogWithEditor });
        const entry = entries.find(e => e.id === selectedId);
        const pointCount = entry && entry.points ? entry.points.length : 5;
        setNewLog({ date: new Date().toISOString().split('T')[0], lotNumber: '', values: Array(pointCount).fill(''), content: '', images: [] });
      };

      const triggerAction = (type, targetId) => {
        let message = type === 'close' ? '종료하시겠습니까?' : type === 'delete' ? '삭제하시겠습니까?' : '재개하시겠습니까?';
        setModalConfig({ type: 'confirm', message, onConfirm: () => {
            if (type === 'close') updateAndSync(entries.map(e => e.id === targetId ? { ...e, status: '종료' } : e), 'UPDATE', { recordId: targetId, afterData: { status: '종료' } });
            else if (type === 'delete') { const delEntry = entries.find(e => e.id === targetId); updateAndSync(entries.filter(e => e.id !== targetId), 'DELETE', { recordId: targetId, beforeData: delEntry }); if (selectedId === targetId) setView('dashboard'); }
            else if (type === 'reopen') updateAndSync(entries.map(e => e.id === targetId ? { ...e, status: '진행중' } : e), 'UPDATE', { recordId: targetId, afterData: { status: '진행중' } });
            setModalConfig({ type: null });
        }});
      };

      const handleEditLogStart = (log) => {
        const entry = entries.find(e => e.id === selectedId);
        const pointCount = entry && entry.points ? entry.points.length : 5;
        const safeValues = Array(pointCount).fill('');
        if (log && Array.isArray(log.values)) { log.values.forEach((v, i) => { if(i < pointCount) safeValues[i] = (v !== null && v !== undefined) ? String(v) : ''; }); }
        setEditingLogData({ ...log, values: safeValues, editorName: log.editorName, images: log.images ? [...log.images] : [] }); setEditingLogId(log.id);
      };
      const handleEditLogChange = (field, val, idx = null) => {
        if (!editingLogData) return;
        if (idx !== null) { const up = [...editingLogData.values]; up[idx] = val; setEditingLogData({ ...editingLogData, values: up }); }
        else { setEditingLogData({ ...editingLogData, [field]: val }); }
      };
      const handleEditLogSave = (entryId) => {
        if (!editingLogData) return;
        if (editingLogData.values.every(v => v === '') && !editingLogData.content && (!editingLogData.images || editingLogData.images.length === 0)) { setModalConfig({ type: 'info', message: '내용 또는 사진을 입력하세요.' }); return; }
        const upData = { ...editingLogData };
        const currentLog = entries.find(e => e.id === entryId)?.logs?.find(l => l.id === editingLogId); updateAndSync(entries.map(entry => entry.id === entryId ? { ...entry, logs: entry.logs.map(l => l.id === editingLogId ? upData : l) } : entry), 'UPDATE', { recordId: entryId, beforeData: currentLog, afterData: upData });
        setEditingLogId(null); setEditingLogData(null); showToast("기록 수정 완료");
      };
      const handleEditLogCancel = () => { setEditingLogId(null); setEditingLogData(null); };
      const handleDeleteLog = (entryId, logId) => {
        if (!canEdit) return;
        setModalConfig({ type: 'confirm', message: '기록을 삭제하시겠습니까?', onConfirm: () => {
            const logToDelete = entries.find(e => e.id === entryId)?.logs?.find(l => l.id === logId); updateAndSync(entries.map(entry => entry.id === entryId ? { ...entry, logs: entry.logs.filter(l => l.id !== logId) } : entry), 'UPDATE', { recordId: entryId, beforeData: logToDelete, afterData: { deleted: true } }); setModalConfig({ type: null }); showToast("삭제 완료");
        }});
      };

      const renderDashboardKPI = () => {
         let totalPoints = 0, stable = 0, warning = 0, action = 0, avgCpkSum = 0, cpkCount = 0;
         let avgCpmSum = 0, cpmCount = 0;
         let psiSum = 0, psiCount = 0;
         let totalWestern = 0, totalOutlier = 0;
         let latestDate = '';

         entries.forEach(entry => {
             if(entry.status === '종료') return;
             const activePoints = entry.points.filter(p => p.name.trim() !== '');
             const sortedLogs = [...(entry.logs || [])].sort((a,b)=>new Date(a.date)-new Date(b.date));
             if (sortedLogs.length > 0) {
                 const currentLatest = sortedLogs[sortedLogs.length - 1].date;
                 if (!latestDate || new Date(currentLatest) > new Date(latestDate)) latestDate = currentLatest;
             }

             activePoints.forEach(p => {
                 totalPoints++;
                 const vals = sortedLogs.map(l => {
                    const rawVal = l.values[entry.points.indexOf(p)];
                    if(rawVal !== '' && rawVal != null) { const parsed = parseFloat(String(rawVal).trim().split(/[\s,\[\]]+/)[0]); if(!isNaN(parsed)) return parsed; }
                    return null;
                 }).filter(v => v !== null);

                 if(vals.length > 1) {
                     const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
                     const stdDev = Math.sqrt(vals.map(x=>Math.pow(x-mean,2)).reduce((a,b)=>a+b)/(vals.length-1)) || 0.01;
                     const statsObj = {mean, stdDev, values:vals};

                     const cpk = Number(calculateCpk(statsObj, p.usl, p.lsl));
                     if(cpk > 0) { avgCpkSum += cpk; cpkCount++; }

                     const cpm = calculateCpm(statsObj, p.target, p.usl, p.lsl);
                     if(cpm !== null && cpm > 0) { avgCpmSum += cpm; cpmCount++; }

                     const rules = appSettings.useWesternRules ? checkWesternElectricRules(vals, mean, stdDev) : [];
                     totalWestern += rules.length;

                     const outlierCnt = vals.filter(v => Math.abs(v - mean) > 3 * stdDev).length;
                     totalOutlier += outlierCnt;

                     const targetDev = (p.target && !isNaN(parseFloat(p.target))) ? mean - parseFloat(p.target) : null;
                     const psi = calculatePSI(cpk, rules.length, targetDev, stdDev, '안정', outlierCnt);
                     psiSum += psi; psiCount++;

                     const psiInfo = getPSIInfo(psi);
                     if(psiInfo.status.includes('Stable')) stable++;
                     else if(psiInfo.status.includes('Warning')) warning++;
                     else action++;
                 }
             });
         });

         const totalAvgCpk = cpkCount > 0 ? (avgCpkSum / cpkCount).toFixed(2) : '-';
         const totalAvgCpm = cpmCount > 0 ? (avgCpmSum / cpmCount).toFixed(2) : '-';
         const totalAvgPsi = psiCount > 0 ? Math.round(psiSum / psiCount) : 0;
         const globalPsiInfo = getPSIInfo(totalAvgPsi);

         return (
            <div className="grid grid-cols-2 md:grid-cols-6 gap-4 mb-6">
               <div className={`col-span-2 md:col-span-2 p-4 rounded-xl border shadow-sm flex flex-col justify-center ${globalPsiInfo.bg} ${globalPsiInfo.border}`}>
                  <p className="text-xs font-extrabold text-gray-500 mb-1">통합 공정안정도 (PSI)</p>
                  <div className="flex items-end gap-3">
                     <p className={`text-4xl font-black ${globalPsiInfo.color}`}>{totalAvgPsi}<span className="text-xl">점</span></p>
                     <p className="text-lg mb-1">{globalPsiInfo.stars}</p>
                  </div>
               </div>
               <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col justify-center">
                  <p className="text-xs font-bold text-gray-500 mb-1">평균 Cpk / Cpm</p>
                  <p className="text-2xl font-black text-indigo-700">{totalAvgCpk} <span className="text-gray-300 mx-1">|</span> <span className="text-teal-600 text-xl">{totalAvgCpm}</span></p>
               </div>
               <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col justify-center">
                  <p className="text-xs font-bold text-gray-500 mb-1">Action / Warning (개소)</p>
                  <p className="text-xl font-black text-red-600">{action} <span className="text-gray-400 text-sm">/</span> <span className="text-orange-500">{warning}</span></p>
               </div>
               <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col justify-center">
                  <p className="text-xs font-bold text-gray-500 mb-1">SPC Rule / 이상치</p>
                  <p className="text-xl font-black text-orange-600">{totalWestern} <span className="text-gray-400 text-sm">/</span> <span className="text-red-600">{totalOutlier}</span></p>
               </div>
               <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col justify-center">
                  <p className="text-xs font-bold text-gray-500 mb-1">최근 측정 / 저장</p>
                  <p className="text-sm font-black text-gray-800">{latestDate || '-'}</p>
                  <p className="text-xs font-medium text-indigo-600 mt-1">오늘 AI 분석: {analysisHistories.filter(h=>h.date===new Date().toISOString().split('T')[0]).length}건</p>
               </div>
            </div>
         );
      };

      const renderDashboard = () => {
        const filteredEntries = entries.filter(e => !searchQuery || e.resinName.toLowerCase().includes(searchQuery.toLowerCase()) || e.cause.toLowerCase().includes(searchQuery.toLowerCase()));

        return (
        <div className="space-y-6 animate-in fade-in relative z-10">
          {entries.length > 0 && renderDashboardKPI()}


          <div className="bg-white p-4 rounded-xl shadow-sm border border-indigo-100 mb-6">
            <h3 className="font-bold text-indigo-800 mb-3 flex items-center gap-2"><span className="material-symbols-outlined icon-sm">menu_book</span> 품질관리 용어 가이드</h3>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
              {qualityAppTerms.filter(t => t.isVisible).sort((a,b)=>a.order-b.order).map((term, idx) => (
                <div key={idx} className="bg-gray-50 border border-gray-100 rounded-lg p-3 hover:shadow-md transition-shadow cursor-help group relative">
                  <div className="flex justify-between items-center mb-1">
                    <span className="font-bold text-indigo-700">{term.name}</span>
                    <span className="text-[10px] bg-indigo-100 text-indigo-800 px-1.5 py-0.5 rounded">{term.category}</span>
                  </div>
                  <p className="text-xs text-gray-600 line-clamp-2">{term.definition.split('\n')[1] || term.definition}</p>

                  {/* 툴팁 */}
                  <div className="hidden group-hover:block absolute z-[100] top-full left-0 mt-2 w-72 bg-white border border-gray-200 shadow-xl rounded-lg p-4 text-xs text-gray-700 whitespace-pre-wrap max-h-80 overflow-y-auto">
                     <div className="font-bold text-sm text-indigo-800 mb-2 border-b pb-1">{term.name}</div>
                     {term.definition}
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-2">
             <div className="flex items-center gap-4">
                 <h2 className="text-2xl font-black text-gray-800 flex items-center gap-2">품질 이력 현황판</h2>
                 <div className="relative">
                     <Icons.Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4"/>
                     <input id="global-search" type="text" placeholder="제품명, 사유 검색 (Ctrl+F)" value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} className="pl-9 pr-4 py-2 bg-white border border-gray-300 rounded-full text-sm outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 shadow-sm w-64"/>
                 </div>
             </div>
             <div className="flex gap-2 w-full md:w-auto">
               <button onClick={() => setView('history')} className="px-4 py-2 bg-white border border-gray-300 text-gray-700 hover:bg-gray-100 rounded-lg flex items-center justify-center gap-2 font-bold shadow-sm flex-1 md:flex-none">
                 <Icons.History /> 분석 이력
               </button>
               <button onClick={() => setView('settings')} className="px-4 py-2 bg-white border border-gray-300 text-gray-700 hover:bg-gray-100 rounded-lg flex items-center justify-center gap-2 font-bold shadow-sm flex-1 md:flex-none">
                 <Icons.Settings /> 설정
               </button>
               <button onClick={() => { if(!isConnected || !canEdit) return showToast('편집 권한이 필요합니다.'); setView('form'); }} className={`px-4 py-2 text-white rounded-lg flex items-center justify-center gap-2 font-bold shadow-sm flex-1 md:flex-none ${canEdit ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-gray-400 cursor-not-allowed'}`}>
                 <Icons.Plus/> 신규 등록
               </button>
             </div>
          </div>

          <div className="grid gap-4 grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
            {filteredEntries.length === 0 ? <div className="col-span-full py-12 text-center bg-white rounded-xl border border-dashed border-gray-300 text-gray-400">등록된 데이터가 없습니다.</div> : (
              filteredEntries.map(entry => {
                const activePointsStr = entry.points && entry.points.filter(p => p.name.trim() !== '').map(p => p.name).join(', ');
                const activePoints = entry.points && entry.points.map((p, i) => ({ ...p, originalIndex: i })).filter(p => p.name.trim() !== '');

                let psiSum = 0; let psiCount = 0;
                let globalStatus = '데이터 없음';
                let cardColor = 'bg-white border-gray-200';

                if (entry.logs && entry.logs.length > 1 && activePoints.length > 0) {
                    activePoints.forEach((p) => {
                       const vals = entry.logs.map(l => {
                          const rawVal = l.values[p.originalIndex];
                          if(rawVal !== '' && rawVal != null) { const parsed = parseFloat(String(rawVal).trim().split(/[\s,\[\]]+/)[0]); if(!isNaN(parsed)) return parsed; }
                          return null;
                       }).filter(v => v !== null);

                       if(vals.length > 1) {
                           const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
                           const stdDev = Math.sqrt(vals.map(x=>Math.pow(x-mean,2)).reduce((a,b)=>a+b)/(vals.length-1)) || 0.01;
                           const statsObj = {mean, stdDev, values:vals};
                           const cpk = Number(calculateCpk(statsObj, p.usl, p.lsl));
                           const rules = appSettings.useWesternRules ? checkWesternElectricRules(vals, mean, stdDev) : [];
                           const outlierCnt = vals.filter(v => Math.abs(v - mean) > 3 * stdDev).length;
                           const targetDev = (p.target && !isNaN(parseFloat(p.target))) ? mean - parseFloat(p.target) : null;

                           const psi = calculatePSI(cpk, rules.length, targetDev, stdDev, '안정', outlierCnt);
                           psiSum += psi; psiCount++;
                       }
                    });
                }

                if (psiCount > 0) {
                    const avgPsi = psiSum / psiCount;
                    const psiInfo = getPSIInfo(avgPsi);
                    globalStatus = psiInfo.status;
                    cardColor = psiInfo.bg + ' ' + psiInfo.border;
                }

                return (
                  <div key={entry.id} onClick={() => { setSelectedId(entry.id); setView('details'); setActiveTabIdx(0); setAiAnalysis(null); }} className={`p-5 rounded-xl border-2 cursor-pointer transition-all hover:shadow-lg relative group flex flex-col bg-white/95 backdrop-blur-sm ${entry.status === '종료' ? 'border-gray-200 bg-gray-100 opacity-80' : cardColor}`}>
                    <div className="flex justify-between items-start mb-2 pr-6"><span className={`px-2 py-1 rounded-full text-xs font-bold ${entry.type === '부적합 대책' ? 'bg-red-100 text-red-600' : 'bg-white text-gray-800 shadow-sm border'}`}>{entry.type}</span><span className={`flex items-center gap-1 text-sm font-semibold ${entry.status === '종료' ? 'text-gray-500' : 'text-gray-900'}`}>{entry.status === '종료' ? <Icons.CheckCircle/> : <Icons.Activity/>} {entry.status}</span></div>
                    <h3 className="text-xl font-black text-gray-900 mb-1">{entry.resinName}</h3>
                    <p className="text-sm text-gray-600 mb-4 truncate">{entry.cause}</p>
                    <div className="flex justify-between text-xs text-gray-500 border-t border-gray-200/50 pt-3 mt-auto font-medium"><span className="truncate max-w-[65%]">항목: {activePointsStr || '-'}</span><span>데이터: {entry.logs ? entry.logs.length : 0}건</span></div>
                    <div className={`mt-3 px-2 py-2 text-xs font-black rounded-lg border text-center shadow-sm bg-white text-gray-800`}>{globalStatus}</div>
                    {entry.status === '종료' && canEdit && <button onClick={(e) => { e.stopPropagation(); triggerAction('delete', entry.id); }} className="absolute top-4 right-4 p-2 text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100"><Icons.Trash2/></button>}
                  </div>
                );
              })
            )}
          </div>
        </div>
        );
      };

      const renderHistoryView = () => {
          const handleSelectCompare = (h, type) => { setCompareSelection(p => ({ ...p, [type]: h })); };

          return (
            <div className="space-y-6 animate-in fade-in relative z-10">
              <div className="flex justify-between items-center mb-6">
                 <div className="flex items-center gap-4">
                     <button onClick={() => setView('dashboard')} className="p-3 bg-white border shadow-sm rounded-full hover:bg-gray-50"><Icons.ArrowLeft /></button>
                     <div>
                       <h2 className="text-2xl font-black text-gray-800 flex items-center gap-2"><Icons.History/> 공정 진단 분석 이력</h2>
                       <p className="text-sm text-gray-500 mt-1">저장된 AI 진단 결과 목록입니다. 과거 결과와 비교(Compare) 할 수 있습니다.</p>
                     </div>
                 </div>
                 <button onClick={() => { if(compareSelection.past && compareSelection.current) setShowCompareModal(true); else showToast('비교할 2개의 대상을 선택하세요.'); }} className="px-6 py-2.5 bg-indigo-600 text-white font-bold rounded-lg shadow-sm hover:bg-indigo-700 disabled:bg-gray-300 transition-colors">
                     선택 항목 비교 분석
                 </button>
              </div>

              <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                 <table className="w-full text-sm text-left whitespace-nowrap">
                    <thead className="bg-gray-100 text-gray-700 border-b">
                       <tr>
                          <th className="p-4 font-bold text-center">비교</th>
                          <th className="p-4 font-bold text-center">분석일자</th>
                          <th className="p-4 font-bold text-center">제품명(Grade)</th>
                          <th className="p-4 font-bold text-center">항목</th>
                          <th className="p-4 font-bold text-center">상태</th>
                          <th className="p-4 font-bold text-center">Cpk</th>
                          <th className="p-4 font-bold text-center">PSI</th>
                          <th className="p-4 font-bold text-center">작업</th>
                       </tr>
                    </thead>
                    <tbody>
                       {analysisHistories.length === 0 ? (
                           <tr><td colSpan="8" className="p-10 text-center text-gray-500">저장된 분석 이력이 없습니다. 상세 화면에서 AI 분석 후 저장하세요.</td></tr>
                       ) : [...analysisHistories].sort((a,b)=>new Date(b.date)-new Date(a.date)).map((h, i) => (
                           <tr key={i} className="border-b hover:bg-indigo-50/50">
                               <td className="p-4 text-center">
                                   <div className="flex flex-col gap-1 items-center">
                                      <label className="text-[10px] flex items-center gap-1"><input type="radio" name="past" checked={compareSelection.past && compareSelection.past.id === h.id} onChange={() => handleSelectCompare(h, 'past')}/> 과거</label>
                                      <label className="text-[10px] flex items-center gap-1"><input type="radio" name="current" checked={compareSelection.current && compareSelection.current.id === h.id} onChange={() => handleSelectCompare(h, 'current')}/> 최신</label>
                                   </div>
                               </td>
                               <td className="p-4 text-center font-medium">{h.date}</td>
                               <td className="p-4 text-center font-bold text-indigo-900">{h.grade}</td>
                               <td className="p-4 text-center">{h.point}</td>
                               <td className="p-4 text-center text-xs font-bold">{h.status}</td>
                               <td className="p-4 text-center font-medium">{h.cpk}</td>
                               <td className="p-4 text-center font-medium">{h.psi}점</td>
                               <td className="p-4 text-center">
                                  <button onClick={() => { setModalConfig({type:'ai_analysis_result', message: h.fullReport})}} className="text-xs bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded hover:bg-indigo-200 mr-2 font-bold">리포트 보기</button>
                                  <button onClick={() => { const up = analysisHistories.filter(x=>x.id!==h.id); setAnalysisHistories(up); localStorage.setItem('qualityAppHistories', JSON.stringify(up)); }} className="text-red-400 hover:text-red-600"><Icons.Trash2/></button>
                               </td>
                           </tr>
                       ))}
                    </tbody>
                 </table>
              </div>
            </div>
          );
      };


        const renderQualityTrend = (logs, pointSpec, stats, n) => {
            if (n === 0) return null;

            const target = parseFloat(pointSpec.target);
            if (isNaN(target)) return <div className="p-4 bg-gray-50 border rounded text-center text-sm text-gray-500">Target 값이 설정되지 않아 추세를 분석할 수 없습니다.</div>;

            const tbiData = logs.map((l, i) => {
                const tbi = calculateAsymmetricTBI(l.value, pointSpec);
                const prev = i > 0 ? logs[i-1].value : null;
                const delta = prev !== null ? l.value - prev : 0;
                return { ...l, tbi, delta };
            });

            const recent5 = tbiData.slice(-5);
            const validRecent5 = recent5.filter(d => d.tbi !== null && !isNaN(d.tbi));
            const avgTbi5 = validRecent5.length > 0 ? validRecent5.reduce((sum, d) => sum + d.tbi, 0) / validRecent5.length : 0;

            const lastData = tbiData[tbiData.length - 1];
            const currentTBI = lastData.tbi || 0;
            const currentDelta = lastData.delta || 0;

            const recent5Vals = recent5.map(d => d.value).filter(v => typeof v === 'number' && !isNaN(v));
            let sigma5 = 0;
            if (recent5Vals.length > 1) {
                const mean5 = recent5Vals.reduce((a, b) => a + b, 0) / recent5Vals.length;
                sigma5 = Math.sqrt(recent5Vals.map(x => Math.pow(x - mean5, 2)).reduce((a, b) => a + b) / (recent5Vals.length - 1));
            }

            const maxAbsTBI = Math.max(1.5, ...tbiData.map(d => Math.abs(d.tbi || 0)));
            const domain = [-Math.ceil(maxAbsTBI), Math.ceil(maxAbsTBI)];

            return (
                <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-200 mt-6 print-break-inside-avoid">
                  <div className="flex justify-between items-center mb-4 border-b pb-2">
                    <h3 className="font-extrabold text-lg text-indigo-900 flex items-center gap-2"><Icons.Activity/> Quality Condition Trend <span className="text-sm font-normal text-gray-500">| 품질 상태 추세</span></h3>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                    <div className="bg-indigo-50 border border-indigo-100 p-4 rounded-lg text-center">
                        <div className="text-xs text-gray-500 font-bold mb-1">현재 Batch TBI</div>
                        <div className={`text-2xl font-black ${Math.abs(currentTBI) > 1 ? 'text-red-600' : Math.abs(currentTBI) > 0.8 ? 'text-orange-500' : 'text-indigo-700'}`}>
                            {currentTBI.toFixed(3)}
                        </div>
                    </div>
                    <div className="bg-blue-50 border border-blue-100 p-4 rounded-lg text-center">
                        <div className="text-xs text-gray-500 font-bold mb-1">최근 5 Batch 평균 TBI</div>
                        <div className="text-2xl font-black text-blue-700">{avgTbi5.toFixed(3)}</div>
                    </div>
                    <div className="bg-green-50 border border-green-100 p-4 rounded-lg text-center">
                        <div className="text-xs text-gray-500 font-bold mb-1">최근 Batch Delta</div>
                        <div className="text-2xl font-black text-green-700">{currentDelta > 0 ? '+' : ''}{currentDelta.toFixed(3)}</div>
                    </div>
                    <div className="bg-purple-50 border border-purple-100 p-4 rounded-lg text-center">
                        <div className="text-xs text-gray-500 font-bold mb-1">최근 5 Batch Sigma</div>
                        <div className="text-2xl font-black text-purple-700">{sigma5.toFixed(3)}</div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                      <div className="border border-gray-100 rounded-lg p-3 bg-gray-50">
                          <h4 className="text-sm font-bold text-gray-700 mb-3 text-center">Target Bias Trend (TBI)</h4>
                          <div className="h-64 w-full">
                            <ResponsiveContainer>
                                <ComposedChart data={tbiData} margin={{ top: 20, right: 30, left: 0, bottom: 20 }}>
                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#E5E7EB" />
                                    <XAxis dataKey="lotNumber" tick={{fontSize: 10}} stroke="#9CA3AF" tickMargin={10} />
                                    <YAxis domain={domain} tick={{fontSize: 10}} stroke="#9CA3AF" />
                                    <Tooltip content={({ active, payload, label }) => {
                                        if (active && payload && payload.length) {
                                            const d = payload[0].payload;
                                            return (
                                                <div className="bg-white p-3 shadow rounded border text-xs">
                                                    <div className="font-bold border-b pb-1 mb-1">{d.date} {d.lotNumber ? `(LOT: ${d.lotNumber})` : ''}</div>
                                                    <div>TBI: <span className="font-bold text-indigo-600">{d.tbi.toFixed(3)}</span></div>
                                                    <div>Delta: <span className="font-bold text-green-600">{d.delta > 0 ? '+' : ''}{d.delta.toFixed(3)}</span></div>

            outlierCount = pureVals.filter(v => Math.abs(v - cl) > 3 * stats.stdDev).length;

                if (index > 0) log.delta = Number((log.value - arr[index - 1].value).toFixed(2));

                const subset = arr.slice(startIdx, index + 1).map(l => l.value);
                log.movingAverage = Number((subset.reduce((a,b)=>a+b, 0) / subset.length).toFixed(2));

                                            <button onClick={() => removeNewLogImage(idx)} className="text-indigo-400 hover:text-red-500 transition-colors"><Icons.X /></button>
                                        </div>
                                    ))}
                                </div>
                            )}
                          </div>

                          <button onClick={handleAddLog} className="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-bold hover:bg-indigo-700 shadow-md transition-transform active:scale-95 text-base">개별 기록 추가하기</button>
                        </div>
                      )}
                    </div>
                  )}
               </div>

               <div className="lg:col-span-2 space-y-6">
                  {activePoints.length > 0 && (
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row gap-4 justify-between items-center no-print">
                      <div className="flex flex-wrap gap-2 flex-1">
                        {activePoints.map((p, idx) => (
                          <div key={idx} className="relative group">
                              <button onClick={() => setActiveTabIdx(idx)} className={`flex-1 min-w-[120px] py-2.5 px-4 rounded-lg border font-black text-sm transition-colors ${activeTabIdx === idx ? 'border-indigo-600 bg-indigo-600 text-white shadow-md' : 'border-gray-200 bg-gray-50 text-gray-600 hover:bg-gray-100'}`}>{p.name}</button>
                              {activePoints.length > 1 && canEdit && entry.status === '진행중' && (
                                  <button onClick={(e) => { e.stopPropagation(); handleRemovePoint(p.originalIndex); }} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity shadow-sm hover:bg-red-600"><Icons.X /></button>
                              )}
                          </div>
                        ))}
                        {canEdit && entry.status === '진행중' && (
                          <button onClick={() => setIsAddPointModalOpen(true)} className="flex-1 min-w-[120px] py-2.5 px-3 rounded-lg border-2 border-dashed border-gray-300 text-gray-500 hover:text-indigo-600 hover:border-indigo-400 font-bold text-sm flex items-center justify-center gap-1 bg-white transition-colors"><Icons.Plus/> 항목 추가</button>
                        )}
                      </div>
                      <div className="flex gap-2 w-full md:w-auto mt-4 md:mt-0">
                      {activePoints.length > 1 && (
                         <button onClick={() => setExpandedChart({ type: 'multi', p1: 0, p2: activePoints.length > 1 ? 1 : -1 })} className="py-2.5 px-4 bg-gray-800 text-white font-bold rounded-lg hover:bg-gray-700 shadow flex items-center gap-2 whitespace-nowrap text-sm"><Icons.Layers /> 통합 관리도</button>
                      )}
                      </div>
                    </div>
                  )}

                  <div className="grid grid-cols-1 gap-6 print-break-inside-avoid">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 h-[450px] relative flex flex-col">
                      <div className="flex justify-between items-center mb-4 shrink-0">
                        <h3 className="font-extrabold text-lg flex items-center gap-2 text-gray-900"><Icons.TrendingUp/> SPC 관리도 ({currentPoint ? currentPoint.name : ''})</h3>
                        <div className="flex gap-2 no-print">
                           {chartZoom.left !== 'dataMin' && <button onClick={handleZoomOut} className="text-xs bg-red-50 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-100 flex items-center gap-1 font-bold border border-red-100 transition-colors">Zoom 초기화</button>}
                           <button onClick={() => setExpandedChart({ type: 'line', pointIdx: activeTabIdx })} className="text-xs bg-gray-100 text-gray-600 px-2 py-1.5 rounded-lg hover:bg-gray-200 flex items-center gap-1 transition-colors"><Icons.Maximize/></button>

                           <button onClick={handlePrint} className="text-xs bg-gray-100 text-gray-700 border border-gray-300 px-3 py-1.5 rounded-full hover:bg-gray-200 flex items-center gap-1 font-bold shadow-sm"><Icons.Printer/> 인쇄</button>
                           <button onClick={exportToExcel} className="text-xs bg-green-50 text-green-700 border border-green-200 px-3 py-1.5 rounded-full hover:bg-green-100 flex items-center gap-1 font-bold shadow-sm"><Icons.FileSpreadsheet/> 엑셀</button>
                           <button onClick={handleOpenAiModal} disabled={isAiLoading} className={`text-xs px-4 py-1.5 rounded-full flex items-center gap-1 font-black shadow-sm transition-colors ${isAiLoading ? 'bg-gray-400 cursor-not-allowed text-white' : 'bg-indigo-600 text-white hover:bg-indigo-700 active:scale-95'}`}><Icons.Sparkles/> 스마트 분석</button>
                        </div>
                      </div>

                      <div className="flex flex-wrap gap-1.5 items-center mb-2 shrink-0 bg-gray-50 px-3 py-2 rounded-xl border border-gray-200 no-print">
                        <span className="text-xs font-bold text-gray-600 mr-2">기준선 표시:</span>
                        <button onClick={() => toggleSpcLine('usl')} className={`text-xs px-2.5 py-1 rounded-md border font-bold transition-colors ${showLines.usl ? 'bg-red-50 border-red-200 text-red-800' : 'bg-white border-gray-200 text-gray-400 hover:bg-gray-100'}`}>USL</button>
                        <button onClick={() => toggleSpcLine('target')} className={`text-xs px-2.5 py-1 rounded-md border font-bold transition-colors ${showLines.target ? 'bg-green-50 border-green-200 text-green-700' : 'bg-white border-gray-200 text-gray-400 hover:bg-gray-100'}`}>Target</button>
                        <button onClick={() => toggleSpcLine('lsl')} className={`text-xs px-2.5 py-1 rounded-md border font-bold transition-colors ${showLines.lsl ? 'bg-red-50 border-red-200 text-red-800' : 'bg-white border-gray-200 text-gray-400 hover:bg-gray-100'}`}>LSL</button>
                        <div className="w-px h-3 bg-gray-300 mx-1"></div>
                        <button onClick={() => toggleSpcLine('ucl')} className={`text-xs px-2.5 py-1 rounded-md border font-bold transition-colors ${showLines.ucl ? 'bg-red-50 border-red-200 text-red-600' : 'bg-white border-gray-200 text-gray-400 hover:bg-gray-100'}`}>UCL</button>
                        <button onClick={() => toggleSpcLine('cl')} className={`text-xs px-2.5 py-1 rounded-md border font-bold transition-colors ${showLines.cl ? 'bg-gray-200 border-gray-300 text-gray-800' : 'bg-white border-gray-200 text-gray-400 hover:bg-gray-100'}`}>CL</button>
                        <button onClick={() => toggleSpcLine('lcl')} className={`text-xs px-2.5 py-1 rounded-md border font-bold transition-colors ${showLines.lcl ? 'bg-red-50 border-red-200 text-red-600' : 'bg-white border-gray-200 text-gray-400 hover:bg-gray-100'}`}>LCL</button>
                      </div>

                      <div className="flex-1 min-h-0">
                          <ResponsiveContainer width="100%" height="100%">
                            <LineChart data={zoomedLogs} margin={{right: 65}} onMouseDown={(e) => e && e.activeLabel && setChartZoom({...chartZoom, refAreaLeft: e.activeLabel})} onMouseMove={(e) => e && chartZoom.refAreaLeft && e.activeLabel && setChartZoom({...chartZoom, refAreaRight: e.activeLabel})} onMouseUp={handleZoom}>
                              <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9"/>
                              <XAxis dataKey="date" tick={{fontSize: 11, fill: '#64748b'}} domain={[chartZoom.left, chartZoom.right]} allowDataOverflow />
                              <YAxis domain={yDomain} tick={{fontSize: 11, fill: '#64748b'}} allowDataOverflow />
                              <Tooltip content={<CustomSpcTooltip />} />
                              <Legend verticalAlign="top" height={36} wrapperStyle={{ fontSize: '12px', fontWeight: 'bold' }}/>

                              {showLines.usl && currentPoint && currentPoint.usl && <ReferenceLine y={parseFloat(currentPoint.usl)} label={{position: 'right', value: `USL: ${currentPoint.usl}`, fill: '#991b1b', fontSize: 11, fontWeight: 'bold'}} stroke="#991b1b" strokeWidth={2} />}
                              {showLines.lsl && currentPoint && currentPoint.lsl && <ReferenceLine y={parseFloat(currentPoint.lsl)} label={{position: 'right', value: `LSL: ${currentPoint.lsl}`, fill: '#991b1b', fontSize: 11, fontWeight: 'bold'}} stroke="#991b1b" strokeWidth={2} />}
                              {showLines.target && currentPoint && currentPoint.target && <ReferenceLine y={parseFloat(currentPoint.target)} label={{position: 'insideTopLeft', value: `Target: ${currentPoint.target}`, fill: '#16a34a', fontSize: 11, fontWeight: 'bold'}} stroke="#16a34a" strokeDasharray="5 5" strokeWidth={2} />}

                              {showLines.ucl && n > 0 && <ReferenceLine y={ucl} label={{position: 'right', value: `UCL: ${ucl.toFixed(2)}`, fill: '#ef4444', fontSize: 11, fontWeight: 'bold'}} stroke="#ef4444" strokeDasharray="3 3" strokeWidth={1.5} />}
                              {showLines.lcl && n > 0 && <ReferenceLine y={lcl} label={{position: 'right', value: `LCL: ${lcl.toFixed(2)}`, fill: '#ef4444', fontSize: 11, fontWeight: 'bold'}} stroke="#ef4444" strokeDasharray="3 3" strokeWidth={1.5} />}
                              {showLines.cl && n > 0 && <ReferenceLine y={cl} label={{position: 'right', value: `CL: ${cl.toFixed(2)}`, fill: '#1e293b', fontSize: 11, fontWeight: 'bold'}} stroke="#1e293b" strokeWidth={1} />}

                              <Line type="monotone" dataKey="value" stroke="#3b82f6" strokeWidth={2.5} dot={{r: 4, strokeWidth: 2}} activeDot={{ r: 7 }} name="측정값" connectNulls isAnimationActive={false}/>
                              {zoomedLogs.map((log, index) => {
                                 if (log.isOutlier || (currentPoint && currentPoint.usl && log.value !== null && log.value > parseFloat(currentPoint.usl)) || (currentPoint && currentPoint.lsl && log.value !== null && log.value < parseFloat(currentPoint.lsl))) { return <ReferenceDot key={`outlier-${index}`} x={log.date} y={log.value} r={6} fill="red" stroke="white" strokeWidth={2} shape="star" isFront={true}/> } return null;
                              })}
                              {(appSettings.trendLine === 'both' || appSettings.trendLine === 'movingAverage') && <Line type="monotone" dataKey="movingAverage" stroke="#f97316" strokeWidth={2} strokeDasharray="5 5" dot={false} name="5-MA(이동평균)" connectNulls isAnimationActive={false}/>}
                              {(appSettings.trendLine === 'both' || appSettings.trendLine === 'linear') && <Line type="monotone" dataKey="linearTrend" stroke="#a855f7" strokeWidth={2} strokeDasharray="3 3" dot={false} name="선형 추세선" connectNulls isAnimationActive={false}/>}
                              {chartZoom.refAreaLeft && chartZoom.refAreaRight && <ReferenceArea x1={chartZoom.refAreaLeft} x2={chartZoom.refAreaRight} strokeOpacity={0.3} fill="#cbd5e1" opacity={0.4} />}
                            </LineChart>
                          </ResponsiveContainer>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 xl:grid-cols-2 gap-6 h-[400px] print-break-inside-avoid">
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 h-full flex flex-col relative">
                            <div className="flex justify-between items-center mb-4 shrink-0">
                                <h3 className="font-extrabold text-lg flex items-center gap-2 text-gray-900"><Icons.Activity /> Capability Analysis</h3>
                                <button onClick={() => setExpandedChart({ type: 'cpk', pointIdx: activeTabIdx })} className="no-print text-xs bg-gray-100 text-gray-600 px-2 py-1.5 rounded hover:bg-gray-200"><Icons.Maximize/></button>
                            </div>
                            <div className="flex gap-2 items-center mb-3 bg-gray-50 p-2 rounded-lg border border-gray-200 shrink-0 no-print">
                               <span className="text-xs font-bold text-gray-600 pl-2">Window:</span>
                               <select className="border border-gray-300 rounded outline-none text-xs px-2 py-1 focus:border-indigo-500 font-bold bg-white" value={movingWindow} onChange={e => setMovingWindow(parseInt(e.target.value))}><option value={10}>10 LOT</option><option value={20}>20 LOT</option><option value={30}>30 LOT</option><option value={50}>50 LOT</option></select>
                               <span className="text-gray-300 mx-1">|</span>
                               <span className="text-xs font-bold text-gray-600">보기:</span>
                               <select className="border border-gray-300 rounded outline-none text-xs px-2 py-1 focus:border-indigo-500 font-bold bg-white" value={cpkViewMode} onChange={e => setCpkViewMode(e.target.value)}><option value="both">모두 보기</option><option value="trend">Cpk Trend 만</option><option value="moving">Moving Cpk 만</option></select>
                            </div>
                            <div className="flex-1 min-h-0">
                                {chartLogs.filter(l => l.mCpk !== null || l.movingCpk !== null).length > 0 ? (
                                    <ResponsiveContainer width="100%" height="100%">
                                        <LineChart data={chartLogs} margin={{top: 10, right: 10, left: -20, bottom: 5}}>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9"/>
                                            <XAxis dataKey="date" tick={{fontSize: 11, fill: '#64748b'}} />
                                            <YAxis domain={[0, 'auto']} tick={{fontSize: 11, fill: '#64748b'}} />
                                            <Tooltip content={<CustomCpkTooltip />} />
                                            <Legend verticalAlign="top" height={30} wrapperStyle={{ fontSize: '11px', fontWeight: 'bold' }} />
                                            <ReferenceLine y={1.67} label={{position: 'insideTopLeft', value: '최우수(1.67)', fill: '#16a34a', fontSize: 10, fontWeight: 'bold'}} stroke="#16a34a" strokeDasharray="3 3" />
                                            <ReferenceLine y={1.33} label={{position: 'insideTopLeft', value: 'Target(1.33)', fill: '#22c55e', fontSize: 10, fontWeight: 'bold'}} stroke="#22c55e" strokeDasharray="3 3" />
                                            <ReferenceLine y={1.0} label={{position: 'insideBottomLeft', value: '경고(1.0)', fill: '#f97316', fontSize: 10, fontWeight: 'bold'}} stroke="#f97316" strokeDasharray="3 3" />
                                            {(cpkViewMode === 'both' || cpkViewMode === 'trend') && <Line type="monotone" dataKey="mCpk" stroke="#6366f1" strokeWidth={2} dot={{r:2, fill:"#6366f1"}} activeDot={{ r: 5 }} name="Cpk Trend (단기)" connectNulls isAnimationActive={false}/>}
                                            {(cpkViewMode === 'both' || cpkViewMode === 'moving') && <Line type="monotone" dataKey="movingCpk" stroke="#ec4899" strokeWidth={3} dot={{r:3, fill:"#ec4899"}} activeDot={{ r: 6 }} name={`Moving Cpk (${movingWindow} LOT)`} connectNulls isAnimationActive={false}/>}
                                        </LineChart>
                                    </ResponsiveContainer>
                                ) : (
                                    <div className="flex items-center justify-center h-full text-sm text-gray-400 bg-gray-50 rounded-xl border border-dashed border-gray-200">데이터가 부족합니다.</div>
                                )}
                            </div>
                        </div>

                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 h-full flex flex-col relative">
                            <div className="flex justify-between items-center mb-2 shrink-0">
                                <h3 className="font-extrabold text-lg flex items-center gap-2 text-gray-900"><Icons.NormalCurve /> 공정 분포도 (Distribution)</h3>
                                <button onClick={() => setExpandedChart({ type: 'area', pointIdx: activeTabIdx })} className="no-print text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded hover:bg-gray-200"><Icons.Maximize/></button>
                            </div>
                            <div className="flex-1 min-h-0 mt-2">
                              {n > 1 ? (
                                <ResponsiveContainer width="100%" height="100%">
                                  <AreaChart data={generateNormalDistData(stats, currentPoint && currentPoint.lsl, currentPoint && currentPoint.target, currentPoint && currentPoint.usl)}>
                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9"/>
                                    <XAxis dataKey="x" type="number" domain={['dataMin', 'dataMax']} tick={{fontSize: 11, fill: '#64748b'}} tickFormatter={(val) => val.toFixed(2)} />
                                    <YAxis hide={true} />
                                    <Tooltip labelFormatter={(val) => `측정값: ${Number(val).toFixed(2)}`} formatter={(val) => [Number(val).toFixed(4), '확률밀도']} />
                                    {currentPoint && currentPoint.usl && <ReferenceLine x={parseFloat(currentPoint.usl)} label={{position: 'insideTopLeft', value: `USL: ${currentPoint.usl}`, fill: '#991b1b', fontSize: 11, fontWeight: 'bold'}} stroke="#991b1b" strokeDasharray="3 3" />}
                                    {currentPoint && currentPoint.lsl && <ReferenceLine x={parseFloat(currentPoint.lsl)} label={{position: 'insideTopRight', value: `LSL: ${currentPoint.lsl}`, fill: '#991b1b', fontSize: 11, fontWeight: 'bold'}} stroke="#991b1b" strokeDasharray="3 3" />}
                                    {currentPoint && currentPoint.target && <ReferenceLine x={parseFloat(currentPoint.target)} label={{position: 'insideTopLeft', value: `Target: ${currentPoint.target}`, fill: '#16a34a', fontSize: 11, fontWeight: 'bold'}} stroke="#16a34a" strokeDasharray="5 5" />}
                                    <ReferenceLine x={stats.mean} label={{position: 'insideBottomRight', value: `CL: ${stats.mean.toFixed(2)}`, fill: '#1e293b', fontSize: 11, fontWeight: 'bold'}} stroke="#1e293b" strokeDasharray="3 3" />
                                    <Area type="monotone" dataKey="y" stroke="#6366f1" fill="#818cf8" fillOpacity={0.4} name="확률밀도" isAnimationActive={false}/>
                                  </AreaChart>
                                </ResponsiveContainer>
                              ) : (
                                <div className="flex items-center justify-center h-full text-sm text-gray-400 bg-gray-50 rounded-xl border border-dashed border-gray-200">데이터가 2개 이상 필요합니다.</div>
                              )}
                            </div>
                        </div>
                    </div>
                  </div>
               </div>
            </div>

            {/* 로그 테이블 영역 */}
            <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 h-[600px] flex flex-col relative overflow-hidden print-break-inside-avoid">
               <h3 className="font-extrabold text-lg mb-3 flex items-center gap-2 text-gray-900 shrink-0"><Icons.FileText/> 상세 기록 내역</h3>
               <div className="flex-1 overflow-y-auto">
                       {(!entry.logs || entry.logs.length === 0) ? (
                         <div className="flex items-center justify-center h-full text-gray-400 text-sm bg-gray-50 rounded-lg border border-dashed border-gray-200">등록된 기록이 없습니다.</div>
                       ) : (
                         <table className="w-full text-sm text-left whitespace-nowrap">
                           <thead className="bg-gray-100 text-gray-600 border-b border-t border-gray-200 sticky top-0 z-10">
                             <tr>
                               <th className="p-3 font-bold text-center">측정일</th>
                               <th className="p-3 font-bold text-center">LOT</th>
                               {activePoints.map((p, i) => ( <th key={i} className="p-3 font-bold text-center">{p.name}</th> ))}
                               <th className="p-3 font-bold">특이사항 및 사진</th>
                               <th className="p-3 font-bold text-center">작성자</th>
                               <th className="p-3 font-bold text-center no-print">관리</th>
                             </tr>
                           </thead>
                           <tbody>
                             {[...(entry.logs || [])].sort((a, b) => new Date(b.date) - new Date(a.date)).map((log, idx) => {
                               const isEditing = editingLogId === log.id;
                               return (
                                 <tr key={idx} className="border-b border-gray-100 hover:bg-indigo-50 transition-colors">
                                   {isEditing ? (
                                     <Fragment>
                                       <td className="p-1.5 align-top"><input type="date" className="w-full border rounded p-1 text-xs" value={editingLogData.date} onChange={e => handleEditLogChange('date', e.target.value)} /></td>
                                       <td className="p-1.5 align-top"><input type="text" className="w-full border rounded p-1 text-xs text-center" value={editingLogData.lotNumber || ''} onChange={e => handleEditLogChange('lotNumber', e.target.value)} /></td>
                                       {activePoints.map((p, i) => ( <td key={i} className="p-1.5 align-top"><input type="text" className="w-full border rounded p-1 text-xs text-center" value={(editingLogData && editingLogData.values) ? editingLogData.values[p.originalIndex] || '' : ''} onChange={e => handleEditLogChange('values', e.target.value, p.originalIndex)} /></td> ))}

                                       {/* 수정 모드: 특이사항 및 사진 관리 */}
                                       <td className="p-1.5 align-top min-w-[200px]">
                                         <input type="text" className="w-full border rounded p-1 text-xs mb-1" value={editingLogData.content || ''} onChange={e => handleEditLogChange('content', e.target.value)} placeholder="조치 및 특이사항" />
                                         <div className="flex flex-wrap gap-1 mt-1">
                                           <input type="file" accept="image/*" className="hidden" id={`edit-image-${log.id}`} onChange={(e) => handleImageUpload(e, true)} />
                                           <button onClick={() => document.getElementById(`edit-image-${log.id}`).click()} className="text-[10px] bg-white border border-gray-300 px-1.5 py-0.5 rounded flex items-center gap-1 hover:bg-gray-50 text-gray-700 shadow-sm">
                                               <Icons.Camera /> 추가
                                           </button>
                                           {(editingLogData.images || []).map((img, i) => (
                                               <span key={i} className="flex items-center gap-0.5 bg-gray-100 border px-1 py-0.5 rounded text-[10px] text-gray-700">
                                                   <span className="truncate max-w-[80px]">{img.name}</span>
                                                   <button onClick={() => removeEditLogImage(i)} className="text-red-400 hover:text-red-600 font-bold ml-0.5">✕</button>
                                               </span>
                                           ))}
                                         </div>
                                       </td>

                                       <td className="p-1.5 text-center text-xs align-top">
                                         <select className="w-full border rounded p-1 outline-none font-bold text-indigo-600 bg-white" value={editingLogData.editorName || ''} onChange={e => handleEditLogChange('editorName', e.target.value)}>
                                            {authors.map((a, i) => <option key={i} value={a}>{a}</option>)}
                                         </select>
                                       </td>
                                       <td className="p-1.5 text-center align-top">
                                         <div className="flex justify-center gap-1">
                                           <button onClick={() => handleEditLogSave(entry.id)} className="bg-green-100 text-green-700 p-1.5 rounded hover:bg-green-200"><Icons.CheckCircle /></button>
                                           <button onClick={handleEditLogCancel} className="bg-gray-200 text-gray-700 p-1.5 rounded hover:bg-gray-300"><Icons.X /></button>
                                         </div>
                                       </td>
                                     </Fragment>
                                   ) : (
                                     <Fragment>
                                       <td className="p-3 font-medium text-gray-800 text-center align-top">{log.date}</td>
                                       <td className="p-3 text-gray-600 text-center align-top">{log.lotNumber || '-'}</td>
                                       {activePoints.map((p, i) => {
                                         const rawVal = (log.values && Array.isArray(log.values)) ? log.values[p.originalIndex] : null;
                                         const numVal = parseFloat(String(rawVal || '').trim().split(/[\s,\[\]]+/)[0]);
                                         const isOutSpec = rawVal !== '' && rawVal != null && !isNaN(numVal) && ((p.usl && numVal > parseFloat(p.usl)) || (p.lsl && numVal < parseFloat(p.lsl)));
                                         return <td key={i} className="p-3 text-center align-top"><span className={`font-bold inline-block ${isOutSpec ? 'text-red-600 bg-red-50 px-2 py-0.5 rounded border border-red-100' : 'text-gray-700'}`}>{rawVal || '-'}</span></td>;
                                       })}

                                       {/* 일반 모드: 특이사항 텍스트 및 사진 뷰어 버튼 */}
                                       <td className="p-3 text-gray-600 text-xs align-top">
                                         <div className="truncate max-w-[150px]" title={log.content}>{log.content}</div>
                                         {(log.images && log.images.length > 0) && (
                                             <button onClick={() => openImageViewer(log.images)} className="mt-1.5 inline-flex items-center gap-1 bg-white border border-gray-300 shadow-sm hover:bg-gray-100 text-gray-700 px-2 py-1 rounded text-[11px] font-bold transition-colors">
                                                <Icons.Camera /> 사진 {log.images.length}
                                             </button>
                                         )}
                                       </td>

                                       <td className="p-3 text-center text-gray-500 text-sm align-top">{log.editorName || '-'}</td>

                <h3 className="text-lg font-bold flex items-center gap-2 text-gray-800"><Icons.FileSpreadsheet/> 엑셀 데이터 매핑</h3>
                <button onClick={() => setExcelState({...excelState, isOpen: false})} className="text-gray-400 hover:text-gray-600"><Icons.X /></button>

                  <p>업로드한 엑셀 파일에서 <b>총 {excelState.data.length}건</b>의 행이 발견되었습니다.</p>
                  <p className="mt-1">시스템의 각 입력 필드와 엑셀의 헤더(열 이름)를 알맞게 짝지어주세요.</p>

                <div className="grid grid-cols-2 gap-x-6 gap-y-4">

                      <select className="w-full border p-2 rounded outline-none bg-white font-medium" value={excelState.mapping.points[p.originalIndex] || ''} onChange={e => handleMapChange('points', e.target.value, p.originalIndex)}>

                  <div className="bg-gray-50 p-3 rounded-lg border col-span-1 md:col-span-2">
                    <label className="block text-sm font-bold text-gray-700 mb-1">조치 및 특이사항</label>
