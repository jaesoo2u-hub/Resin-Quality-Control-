      Upload: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,

      Camera: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>,
      ChevronLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>,
      ChevronRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>,
      Settings: () => <span className="material-symbols-outlined icon-md">settings</span>,
      History: () => <span className="material-symbols-outlined icon-md">history</span>
    };

    const getStats = (logs) => {
      if (!logs || logs.length === 0) return { mean: 0, stdDev: 0, values: [] };
      const values = logs.map(l => parseFloat(l.value)).filter(v => !isNaN(v));
      if (values.length === 0) return { mean: 0, stdDev: 0, values: [] };
      const mean = values.reduce((a, b) => a + b, 0) / values.length;
      const stdDev = values.length > 1 ? Math.sqrt(values.map(x => Math.pow(x - mean, 2)).reduce((a, b) => a + b) / (values.length - 1)) : 0;
      return { mean, stdDev, values };
    };

    const calculateCpk = (stats, usl, lsl) => {
      const { mean, stdDev, values } = stats;
      if (values.length < 2 || stdDev === 0) return 0;
      const parsedUsl = parseFloat(usl);
      const parsedLsl = parseFloat(lsl);
      let cpu = 9.99, cpl = 9.99;
      if (!isNaN(parsedUsl)) cpu = (parsedUsl - mean) / (3 * stdDev);
      if (!isNaN(parsedLsl)) cpl = (mean - parsedLsl) / (3 * stdDev);
      return Math.min(cpu, cpl).toFixed(2);
    };

    const calculateCpm = (stats, target, usl, lsl) => {
      const { mean, stdDev, values } = stats;
      if (values.length < 2 || stdDev === 0 || isNaN(parseFloat(usl)) || isNaN(parseFloat(lsl)) || isNaN(parseFloat(target))) return null;
      const parsedUsl = parseFloat(usl);
      const parsedLsl = parseFloat(lsl);
      const parsedTarget = parseFloat(target);

      const variance = Math.pow(stdDev, 2);
      const biasSq = Math.pow(mean - parsedTarget, 2);
      const denominator = 6 * Math.sqrt(variance + biasSq);

      if (denominator === 0) return 0;
      return Number(((parsedUsl - parsedLsl) / denominator).toFixed(2));
    };

    const calculatePSI = (cpk, westernRulesCount, targetDev, stdDev, stdTrendStr, outlierCount) => {
        let score = 0;
        if (cpk >= 1.67) score += 30;
        else if (cpk >= 1.33) score += 25;
        else if (cpk >= 1.0) score += 20;
        else if (cpk > 0) score += 10;

        if (westernRulesCount === 0) score += 30;
        else if (westernRulesCount === 1) score += 15;

        if (targetDev === null || targetDev === undefined || isNaN(targetDev)) {
            score += 20;
        } else {
            const devRatio = Math.abs(targetDev) / (stdDev || 1);
            if (devRatio <= 0.5) score += 20;
            else if (devRatio <= 1.0) score += 10;
        }

        if (stdTrendStr && stdTrendStr.includes('증가')) score += 0;
        else if (stdTrendStr && stdTrendStr.includes('감소')) score += 10;
        else score += 10;

        if (outlierCount === 0) score += 10;
        else if (outlierCount === 1) score += 5;

        return Math.max(0, Math.min(100, score));
    };

    const getPSIInfo = (score) => {
        if (score >= 95) return { stars: '★★★★★', status: '🟢 Stable', color: 'text-green-600', bg: 'bg-green-50', border: 'border-green-200' };
        if (score >= 85) return { stars: '★★★★☆', status: '🟢 Stable', color: 'text-green-500', bg: 'bg-green-50', border: 'border-green-200' };
        if (score >= 70) return { stars: '★★★☆☆', status: '🟡 Warning', color: 'text-orange-500', bg: 'bg-orange-50', border: 'border-orange-200' };
        if (score >= 50) return { stars: '★★☆☆☆', status: '🔴 Action Required', color: 'text-red-500', bg: 'bg-red-50', border: 'border-red-200' };
        return { stars: '★☆☆☆☆', status: '🔴 Action Required', color: 'text-red-600', bg: 'bg-red-50', border: 'border-red-200' };
    };

    const generateNormalDistData = (stats, lsl, target, usl) => {
      const { mean, stdDev, values } = stats;
      if (values.length < 2 || stdDev === 0) return [];
      const parsedLsl = parseFloat(lsl);
      const parsedUsl = parseFloat(usl);
      let minX = mean - 4 * stdDev;
      let maxX = mean + 4 * stdDev;
      if (!isNaN(parsedLsl)) minX = Math.min(minX, parsedLsl - stdDev);
      if (!isNaN(parsedUsl)) maxX = Math.max(maxX, parsedUsl + stdDev);
      const step = (maxX - minX) / 100;
      const data = [];
      for (let x = minX; x <= maxX; x += step) {
        const pdf = (1 / (stdDev * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * Math.pow((x - mean) / stdDev, 2));
        data.push({ x: Number(x.toFixed(3)), y: Number(pdf.toFixed(4)) });
      }
      return data;
    };

    const checkWesternElectricRules = (values, mean, stdDev) => {
      const rules = [];
      if (values.length < 2) return rules;

      const ucl = mean + 3 * stdDev;
      const lcl = mean - 3 * stdDev;

      const last = values[values.length - 1];
      if (last > ucl || last < lcl) rules.push("① 1개 점이 3σ (UCL/LCL) 밖");

      if (values.length >= 3) {
          const recent3 = values.slice(-3);
          let count2Sig = 0;
          recent3.forEach(v => { if (v > mean + 2*stdDev || v < mean - 2*stdDev) count2Sig++; });
          if (count2Sig >= 2) rules.push("② 최근 3개 중 2개가 ±2σ 밖");
      }

      if (values.length >= 5) {
          const recent5 = values.slice(-5);
          let count1Sig = 0;
          recent5.forEach(v => { if (v > mean + 1*stdDev || v < mean - 1*stdDev) count1Sig++; });
          if (count1Sig >= 4) rules.push("③ 최근 5개 중 4개가 ±1σ 밖");
      }

      if (values.length >= 8) {
          const recent8 = values.slice(-8);
          const allAbove = recent8.every(v => v > mean);
          const allBelow = recent8.every(v => v < mean);
          if (allAbove || allBelow) rules.push("④ 최근 8개가 평균선 한쪽에 연속 존재");
      }

      if (values.length >= 6) {
          const recent6 = values.slice(-6);
          let inc = true, dec = true;
          for (let i = 1; i < 6; i++) {
              if (recent6[i] <= recent6[i-1]) inc = false;
              if (recent6[i] >= recent6[i-1]) dec = false;
          }
          if (inc) rules.push("⑤ 최근 6개 연속 지속 상승 (경향성)");
          if (dec) rules.push("⑥ 최근 6개 연속 지속 하락 (경향성)");
      }
      return rules;
    };

    const getMovingStats = (logs, windowSize, usl, lsl, movingWindow) => {
      const activeWindow = movingWindow || 20;
      return logs.map((log, idx, arr) => {
          const start = Math.max(0, idx - windowSize + 1);
          const subVals = arr.slice(start, idx + 1).map(l => l.value);
          let mCpk = null;
          let mStd = 0;
          if (subVals.length >= 2) {
              const mMean = subVals.reduce((a,b)=>a+b,0)/subVals.length;
              mStd = Math.sqrt(subVals.map(x=>Math.pow(x-mMean,2)).reduce((a,b)=>a+b)/(subVals.length-1));
              if (mStd > 0) {
                  let cpu = 9.99, cpl = 9.99;
                  if (!isNaN(parseFloat(usl))) cpu = (parseFloat(usl) - mMean) / (3 * mStd);
                  if (!isNaN(parseFloat(lsl))) cpl = (mMean - parseFloat(lsl)) / (3 * mStd);
                  mCpk = Number(Math.min(cpu, cpl).toFixed(2));
              }
          }

          const moveStart = Math.max(0, idx - activeWindow + 1);
          const moveSubVals = arr.slice(moveStart, idx + 1).map(l => l.value);
          let movingCpk = null;
          let mwMean = null;
          let mwStd = null;
          if (moveSubVals.length >= Math.min(10, activeWindow)) {
             mwMean = moveSubVals.reduce((a,b)=>a+b,0)/moveSubVals.length;
             mwStd = Math.sqrt(moveSubVals.map(x=>Math.pow(x-mwMean,2)).reduce((a,b)=>a+b)/(moveSubVals.length-1));
             if (mwStd > 0) {
                 let mcpu = 9.99, mcpl = 9.99;
                 if (!isNaN(parseFloat(usl))) mcpu = (parseFloat(usl) - mwMean) / (3 * mwStd);
                 if (!isNaN(parseFloat(lsl))) mcpl = (mwMean - parseFloat(lsl)) / (3 * mwStd);
                 movingCpk = Number(Math.min(mcpu, mcpl).toFixed(2));
             }
          }

          return { ...log, mCpk, mStd: Number(mStd.toFixed(4)), movingCpk, mwMean: mwMean !== null ? Number(mwMean.toFixed(3)) : null, mwStd: mwStd !== null ? Number(mwStd.toFixed(4)) : null };
      });
    };

    const getStdTrend = (movingStats) => {
       if (movingStats.length < 5) return { trend: '데이터 부족', slope: 0 };
       const recent = movingStats.slice(-5).filter(s => s.mStd !== undefined && !isNaN(s.mStd));
       if (recent.length < 2) return { trend: '데이터 부족', slope: 0 };

       let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
       const n = recent.length;
       recent.forEach((s, i) => { sumX += i; sumY += s.mStd; sumXY += i * s.mStd; sumXX += i * i; });
       const m = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);

       const meanStd = sumY / n;
       if (m > meanStd * 0.05) return { trend: '산포 증가', slope: m };
       if (m < -meanStd * 0.05) return { trend: '산포 감소', slope: m };
       return { trend: '산포 안정적 유지', slope: m };
    };

    const parsePastedDate = (str) => {
      if (!str) return null;
      let cleanStr = str.trim().replace(/\s+/g, '');
      const ymdMatch = cleanStr.match(/^(\d{4})[\.\/\-](\d{1,2})[\.\/\-](\d{1,2})\.?$/);
      if (ymdMatch) return `${ymdMatch[1]}-${ymdMatch[2].padStart(2, '0')}-${ymdMatch[3].padStart(2, '0')}`;
      const koMatch = cleanStr.match(/^(\d{4})년(\d{1,2})월(\d{1,2})일?$/);
      if (koMatch) return `${koMatch[1]}-${koMatch[2].padStart(2, '0')}-${koMatch[3].padStart(2, '0')}`;
      if (/^\d{8}$/.test(cleanStr)) return `${cleanStr.substring(0, 4)}-${cleanStr.substring(4, 6)}-${cleanStr.substring(6, 8)}`;
      const parsed = new Date(cleanStr.replace(/[\.\/]/g, '-'));
      if (!isNaN(parsed.getTime())) return parsed.toISOString().split('T')[0];
      return null;
    };



    const classifyInspectionStage = (pointName) => {
        if (!pointName) return 'UNKNOWN';
        const nameStr = pointName.toLowerCase();

        const processKeywords = ['산가', '탈수량', '메탄올', '회수량', '반응', '굴절'];
        const qcKeywords = ['최종', '고형분', '점착', '출하'];

        if (processKeywords.some(kw => nameStr.includes(kw))) {
            return 'PROCESS';
        }
        if (qcKeywords.some(kw => nameStr.includes(kw))) {
            if (nameStr.includes('반응') && nameStr.includes('점도')) return 'PROCESS';
            return 'FINAL_QC';
        }
        return 'UNKNOWN';
    };

    const calculateAsymmetricTBI = (current, spec) => {
        if (current === null || current === undefined || isNaN(current)) return null;

        const target = parseFloat(spec.target);
        const lsl = parseFloat(spec.lsl);
        const usl = parseFloat(spec.usl);

        if (isNaN(target)) return null;
        if (current === target) return 0;

        if (current > target) {
            if (isNaN(usl)) return null;
            if (usl === target) return (current - target) > 0 ? Infinity : 0;
            return (current - target) / (usl - target);
        } else {
            if (isNaN(lsl)) return null;
            if (target === lsl) return (current - target) < 0 ? -Infinity : 0;
            return (current - target) / (target - lsl);
        }
    };


    const TRY_GET_HISTORICAL_BASELINE = (logs) => {
        if (!logs || logs.length < 15) {
            return { status: 'UNAVAILABLE' };
        }

        const baseLogs = logs.slice(0, 10).map(l => Number(l.value)).filter(v => !isNaN(v));
        if (baseLogs.length < 10) return { status: 'UNAVAILABLE' };

        const mean = baseLogs.reduce((a, b) => a + b, 0) / baseLogs.length;
        const stdDev = Math.sqrt(baseLogs.map(x => Math.pow(x - mean, 2)).reduce((a, b) => a + b) / (baseLogs.length - 1)) || 0.01;

        let validMRs = [];
        for (let i = 1; i < baseLogs.length; i++) {
            validMRs.push(Math.abs(baseLogs[i] - baseLogs[i-1]));
        }
        const typicalVariation = validMRs.length > 0 ? (validMRs.reduce((a, b) => a + b, 0) / validMRs.length) : 0;

        // 3. 안정성 검사
        // 극단적 변동 존재 여부 (예: stdDev가 typicalVariation 대비 너무 크거나, 3시그마 벗어나는 값이 여러개)
        const outliers = baseLogs.filter(v => Math.abs(v - mean) > 3 * stdDev).length;
        if (outliers > 1) return { status: 'UNAVAILABLE' };

        const recent5 = logs.slice(-5).map(l => Number(l.value)).filter(v => !isNaN(v));
        if (recent5.length === 5) {
            const recentMean = recent5.reduce((a, b) => a + b, 0) / 5;
            // 5. 최근 5 Batch가 Baseline보다 지나치게 이탈하는지 (오염 방지)
            if (Math.abs(recentMean - mean) > 3 * stdDev) {
               return { status: 'UNAVAILABLE' };
            }
        }

        return { status: 'AVAILABLE', mean, stdDev, typicalVariation: typicalVariation || 0.01 };
    };


    const generateLocalAIReport = (filteredLogs, spec, productName, appSettings, processProfile, extData = null) => {
      return new Promise(resolve => {
        setTimeout(() => {
          try {
            const validLogs = filteredLogs.filter(l => l.value !== null && l.value !== '' && !isNaN(Number(l.value)));

            if(!validLogs || validLogs.length < 3) {
              resolve(`📊 [${productName}] AI 공정 진단 리포트\n* 분석 프로필: ${processProfile}\n\n■ 1. AI 판단 신뢰도 (Reliability)\n- 신뢰도 수준 : 낮음 (데이터 부족)\n- Baseline 확보: 미확보\n\n■ 2. 현재 품질 상태 (State)\n- 규격 이탈 여부: 정상\n- 최종 패턴 판정: Insufficient Data\n\n■ 3. 최근 단기 변화\n- 분석 불가\n\n■ 4. Target Bias / 변동성\n- 분석 불가\n\n■ 5. 이상 패턴 및 위험도\n- Internal Risk Score: 0 / 100\n- 이상 징후: Insufficient Data\n\n■ 6. Trend / Baseline 판단\n- 분석 불가\n\n■ 7. QA 현장 권고\n1. 데이터가 최소 3 Batch 이상 축적된 후 분석 가능합니다.\n* AI의 제안은 권고사항이며, 실제 조치 및 원인 확정은 QA 판단에 따릅니다.\n\n■ 8. QA 종합 의견 (Conclusion)\n⚪ 데이터 축적 후 재분석 권고\n\n==================================================\n■ 9. 통계 참고지표 (Reference)\n- 데이터 부족`);
              return;
            }

            const pointName = extData && extData.point ? extData.point : productName;
            const stage = classifyInspectionStage(pointName);

            const vals = validLogs.map(l => Number(l.value));
            const lastVal = vals[vals.length - 1];
            const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
            const stdDev = Math.sqrt(vals.map(x => Math.pow(x - avg, 2)).reduce((a, b) => a + b) / (vals.length - 1)) || 0.01;

            const parsedUsl = parseFloat(spec.usl);
            const parsedLsl = parseFloat(spec.lsl);

            let wRulesCount = wRules.length;

            const baselineObj = TRY_GET_HISTORICAL_BASELINE(validLogs);

            const recent3 = vals.slice(-3);
            const recent5 = vals.slice(-5);
            const previous5 = vals.length >= 10 ? vals.slice(-10, -5) : [];

            const current = lastVal;
            const previous = vals.length >= 2 ? vals[vals.length - 2] : null;

            const currentTBI = calculateAsymmetricTBI(current, spec);
            const recent5Mean = recent5.length > 0 ? recent5.reduce((a,b)=>a+b,0)/recent5.length : null;
            const recent5TBI = recent5Mean !== null ? calculateAsymmetricTBI(recent5Mean, spec) : null;
            const prev5Mean = previous5.length > 0 ? previous5.reduce((a,b)=>a+b,0)/previous5.length : null;
            const prev5TBI = prev5Mean !== null ? calculateAsymmetricTBI(prev5Mean, spec) : null;

            let isSpecOut = false;
            if (!isNaN(parsedUsl) && current > parsedUsl) isSpecOut = true;
            if (!isNaN(parsedLsl) && current < parsedLsl) isSpecOut = true;

            let delta = previous !== null ? current - previous : 0;

            // 4. Baseline 미확보 시 Typical Variation 계산 개선 (현재 Batch 제외)
            let tempMRs = [];
            const referenceVals = vals.slice(0, -1);
            for (let i = 1; i < referenceVals.length; i++) tempMRs.push(Math.abs(referenceVals[i] - referenceVals[i-1]));
            let tempTypicalVar = tempMRs.length > 0 ? tempMRs.reduce((a,b)=>a+b,0)/tempMRs.length : null;

            let typicalVar = baselineObj.status === 'AVAILABLE' ? baselineObj.typicalVariation : tempTypicalVar;

            // 5. Measurement Noise: 임시 기본값이며 실제 제품별 측정 정밀도가 확보되면 대체 필요
            const MEASUREMENT_NOISE = 0.01;
            let jumpRatio = 0;
            if (typicalVar !== null) {
                jumpRatio = Math.abs(delta) / Math.max(typicalVar, MEASUREMENT_NOISE);
            }

            // 6. Trend 방향성 판정 개선
            let isTrendUp = false;
            let isTrendDown = false;
            if (recent5.length === 5) {
                let upCount = 0, downCount = 0;
                for (let i = 1; i < 5; i++) {
                    if (recent5[i] > recent5[i-1]) upCount++;
                    else if (recent5[i] < recent5[i-1]) downCount++;
                }
                if (upCount >= 3 && recent5[4] > recent5[0]) isTrendUp = true;
                if (downCount >= 3 && recent5[4] < recent5[0]) isTrendDown = true;
            }

            let isTbiChangedSignificantly = prev5TBI !== null && Math.abs(recent5TBI - prev5TBI) > 0.2;
            let isBaselineShifted = baselineObj.status === 'AVAILABLE' && Math.abs(recent5Mean - baselineObj.mean) > baselineObj.stdDev * 1.5;

            const recent5StdDev = recent5.length > 1 ? Math.sqrt(recent5.map(x=>Math.pow(x-recent5Mean,2)).reduce((a,b)=>a+b)/(recent5.length-1)) : 0.01;

            let pattern = "Stable";

            if (isSpecOut) {
                pattern = "Spec-Out";
            } else if (jumpRatio >= 3.0 && Math.abs(delta) > Math.max(MEASUREMENT_NOISE * 2, typicalVar * 2)) {
                pattern = "Sudden Jump";
            } else if ((isTrendUp || isTrendDown) && (isBaselineShifted || isTbiChangedSignificantly)) {
                if (baselineObj.status === 'AVAILABLE') {
                    if (isBaselineShifted) {
                        pattern = "Target Drift";
                    } else {
                        pattern = "Normal Fluctuation";
                    }
                } else {
                    pattern = "Target Drift Candidate";
                }
            } else if (recent5StdDev > (baselineObj.status === 'AVAILABLE' ? Math.max(baselineObj.stdDev * 1.5, MEASUREMENT_NOISE*5) : Math.max(stdDev * 1.5, MEASUREMENT_NOISE*5)) && recent5.length >= 5) {
                pattern = "Spread Increase";
            } else if (currentTBI !== null && Math.abs(currentTBI) >= 0.8) {
                pattern = "Spec Approach";
            }

            let riskScore = 0;
            if (pattern === "Spec-Out") riskScore = 90;
            else if (pattern === "Sudden Jump") riskScore = 75;
            else if (pattern === "Target Drift") riskScore = 70;
            else if (pattern === "Spread Increase") riskScore = 65;
            else if (pattern === "Target Drift Candidate") riskScore = 60;
            else if (pattern === "Spec Approach") riskScore = 55;
            else if (pattern === "Normal Fluctuation") riskScore = 30;
            else riskScore = 10;

            if (currentTBI !== null && Math.abs(currentTBI) > 0.5 && riskScore < 50) riskScore += 10;

            let dataReliability = "";
            let relScoreText = "";
            if (vals.length >= 15) { dataReliability = "높음"; relScoreText = `최근 ${vals.length} Batch 확보 (충분)`; }
            else if (vals.length >= 8) { dataReliability = "보통"; relScoreText = `최근 ${vals.length} Batch 확보 (보통)`; }
            else { dataReliability = "낮음"; relScoreText = `최근 ${vals.length} Batch 확보 (부족)`; }

            let baselineText = baselineObj.status === 'AVAILABLE' ? "확보됨 (정상패턴 대조 가능)" : "미확보 (단기 변화만 추적)";

            let recommendations = [];
            const addRec = (act) => { recommendations.push(act); };

            let decision = "";
            if (pattern === "Spec-Out") {
                decision = "🔴 QA 즉시 확인 권고";
                addRec("재측정 및 샘플링 상태 재확인");
                addRec("최근 원료 LOT 변경 이력 확인");
                addRec("배합, 투입, 핵심 반응조건 이력 확인");
            } else if (pattern === "Sudden Jump") {
                decision = "🟠 원인 확인 및 해당 Batch 검토 권고";
                addRec("최근 원료 LOT 변경 및 불량 여부 확인");
                addRec("투입량/배합비 오차 확인");
                addRec("작업 조건 변경 사항 확인");
                addRec("샘플링 이상/재측정 필요성 검토");
            } else if (pattern === "Target Drift" || pattern === "Target Drift Candidate") {
                decision = "🟠 다음 Batch 집중 확인 및 원인 후보 조사 권고";
                if (stage === 'PROCESS') {
                    addRec("반응기 온도 프로파일 및 승온 속도 점검");
                    addRec("촉매 투입량/투입 시점 확인");
                    addRec("반응 시간 및 종료 조건 편차 확인");
                } else if (stage === 'FINAL_QC') {
                    addRec("원료 물성 변화 및 원료 LOT 이력 확인");
                    addRec("배합비 및 투입량 미세 오차 누적 점검");
                } else {
                    addRec("원료 특성 및 배합/투입 이력 확인");
                    addRec("최근 공정 조건(온도/시간 등) 변경점 확인");
                }
            } else if (pattern === "Spread Increase") {
                decision = "🟠 반응/검사 변동요인 확인 권고";
                if (stage === 'PROCESS') {
                    addRec("교반 RPM 및 Mixing 상태 확인");
                    addRec("온도 제어 편차 확인");
                } else if (stage === 'FINAL_QC') {
                    addRec("최종 희석 공정 및 용제 투입 편차 점검");
                    addRec("샘플링 및 검사 반복성 오차 확인");
                } else {
                    addRec("계측기/검사 과정의 반복성 오차 확인");
                    addRec("공정 내 변동 요인(설비, 작업자) 점검");
                }
            } else if (pattern === "Spec Approach") {
                decision = "🟡 Target 및 다음 Batch 집중 모니터링 권고";
                addRec("현재 규격 접근 방향의 공정 여유도(Margin) 재평가");
                addRec("다음 Batch의 유사 편향 발생 시 보정 검토");
            } else {

                addRec("특별한 이상 징후 없음. 현행 표준 작업 유지");

            let tbiStr = currentTBI !== null ? `${currentTBI > 0 ? '+' : ''}${currentTBI.toFixed(2)}` : "판정불가";
            let jumpInfoStr = `직전 대비 ${delta > 0 ? '+' : ''}${delta.toFixed(2)} 변화 (Jump Ratio: ${jumpRatio.toFixed(1)})`;

            const report = `📊 [${productName}] AI 공정 진단 리포트
* 분석 프로필: ${processProfile}

■ 1. AI 판단 신뢰도 (Reliability)

■ 3. 최근 단기 변화

■ 4. Target Bias / 변동성

- 이상 징후: ${pattern}

■ 6. Trend / Baseline 판단
- ${baselineObj.status === 'AVAILABLE' ? (pattern === "Target Drift" ? '과거 정상 범위 이탈됨' : '과거 정상 범위 내 변동') : 'Baseline 미확보로 비교 불가'}

${recommendations.map((r, i) => `${i+1}. ${r}`).join('\n')}

- Sigma (전체)        : ${stdDev.toFixed(4)}`;

            resolve(report);
          } catch (error) {

        }, 1000);
      });

            { name: 'Cpk', category: '통계 지표', definition: '원론적 정의:\n공정 평균이 규격 중심에서 얼마나 치우쳐 있는지와 공정의 산포를 함께 고려하여, 공정이 규격 범위 안에서 어느 정도의 능력을 가지는지를 나타내는 공정능력지수입니다.\n\n합성수지 Batch 생산에서의 의미:\n동일 수지의 Batch 결과가 설정된 규격 범위 안에서 얼마나 안정적으로 생산되고 있는지를 참고하는 지표입니다. 제품별 Spec Width와 데이터 특성에 따라 해석이 달라질 수 있습니다.\n\n현재 프로그램에서의 사용:\n현재 프로그램에서는 통계 참고지표로 사용하며, Smart Analysis의 핵심 패턴 판정은 Cpk 하나에 의존하지 않습니다.\n\n해석 방법:\n일반적으로 값이 높을수록 규격 대비 공정능력이 양호합니다. 그러나 당사의 다품종 Batch 생산에서는 Target 편차, 최근 Batch 변화, 데이터 수 등을 함께 확인해야 합니다.', isVisible: true, order: 1 },
            { name: 'Cpm', category: '통계 지표', definition: '원론적 정의:\n규격 한계뿐 아니라 공정 평균이 목표값(Target)에서 얼마나 벗어났는지도 함께 고려하는 공정능력지수입니다.\n\n합성수지 Batch 생산에서의 의미:\n규격 안에는 들어오지만 점도나 고형분 등이 목표값에서 지속적으로 벗어나는 상황을 확인하는 데 의미가 있습니다.\n\n현재 프로그램에서의 사용:\n현재 프로그램에서는 Target 관련 보조 통계지표로 활용하며, Smart Analysis의 핵심 패턴 판정은 TBI와 Batch 변화 등을 중심으로 수행합니다.\n\n해석 방법:\n공정 산포뿐 아니라 Target에서의 평균 이격이 커질수록 Cpm이 낮아질 수 있습니다.', isVisible: true, order: 2 },
            { name: 'Sigma', category: '통계 지표', definition: '원론적 정의:\n데이터의 산포 정도를 나타내는 통계적 지표로, 측정값이 평균을 중심으로 얼마나 퍼져 있는지를 나타냅니다.\n\n합성수지 Batch 생산에서의 의미:\n동일 수지를 반복 생산할 때 점도, 고형분, 산가 등의 Batch 결과가 얼마나 들쭉날쭉한지를 파악하는 데 활용합니다.\n\n현재 프로그램에서의 사용:\n최근 Batch의 산포와 전체 데이터의 변동성을 파악하는 참고지표로 활용합니다.\n\n해석 방법:\nSigma가 커질수록 일반적으로 Batch 간 변동성이 커진 것으로 볼 수 있으므로 Target과 규격 위치를 함께 확인해야 합니다.', isVisible: true, order: 3 },
            { name: 'UCL / LCL', category: '통계 지표', definition: '원론적 정의:\n관리도의 상한 관리한계(UCL)와 하한 관리한계(LCL)로, 통계적으로 정상적인 공정 변동 범위를 판단하기 위한 기준선입니다.\n\n합성수지 Batch 생산에서의 의미:\n고객 또는 사내 규격인 USL/LSL과는 별개로, 해당 데이터에서 평소 공정이 어느 정도 범위로 변동하는지를 판단하는 기준입니다.\n\n현재 프로그램에서의 사용:\nSPC 관리도에서 통계적 관리한계로 표시되며, 평소 변동과 다른 신호를 확인하는 데 활용합니다.\n\n해석 방법:\nUCL/LCL을 벗어나면 평소 공정 변동과 다른 신호일 가능성이 있으므로 원료, 반응조건, 설비, 측정 및 샘플링 상태 등을 함께 확인합니다.', isVisible: true, order: 4 },
            { name: 'Western Rule', category: '통계 지표', definition: '원론적 정의:\n관리도에서 평균으로부터의 이탈이나 연속적인 증가·감소 등 비정상적인 패턴을 탐지하기 위한 통계적 규칙입니다.\n\n합성수지 Batch 생산에서의 의미:\n규격 이탈 전에 나타날 수 있는 비정상적인 데이터 패턴을 확인하는 데 참고할 수 있지만, 당사의 비연속적인 다품종 Batch 생산에서는 생산 간격과 제품 특성을 고려하여 신중하게 해석해야 합니다.\n\n현재 프로그램에서의 사용:\n현재 프로그램에서는 여러 Western Electric Rule 패턴을 참고지표로 계산합니다.\n\n해석 방법:\n규칙 발생 자체가 불량이나 특정 원인을 의미하는 것은 아니며, 평소와 다른 패턴이 발생했는지 확인하고 원인 조사를 보조하는 용도로 활용합니다.', isVisible: true, order: 5 },
            { name: 'Moving Average', category: '통계 지표', definition: '원론적 정의:\n최근 일정 개수의 데이터를 평균하여 단기적인 흐름을 부드럽게 보는 방법입니다.\n\n합성수지 Batch 생산에서의 의미:\n최근 3~5 Batch 등의 평균 변화를 통해 일시적인 한 점보다 최근 공정 방향을 파악하는 데 활용합니다.\n\n현재 프로그램에서의 사용:\n최근 Batch 흐름 분석에 활용합니다.\n\n해석 방법:\n단기 추세를 보는 데 도움이 되지만 데이터가 적을 경우 과도한 해석을 피합니다.', isVisible: true, order: 6 },
            { name: 'Spec-Out', category: '상태 지표', definition: '원론적 정의:\n측정값이 규격 상한 또는 하한을 벗어난 상태입니다.\n\n합성수지 Batch 생산에서의 의미:\n해당 Batch가 제품의 설정 품질 규격을 벗어난 상태이며 QA 확인이 필요한 직접적인 이상 신호입니다.\n\n현재 프로그램에서의 사용:\nSmart Analysis의 최우선 상태 판정으로 사용합니다.\n\n해석 방법:\nSpec-Out 자체는 확인이 필요한 상태이며 최종 조치 여부는 QA 판단에 따릅니다.', isVisible: true, order: 7 },
            { name: 'PSI', category: '내부 지표', definition: '원론적 정의:\n현재 프로그램에서 사용하는 내부 종합 위험도·상태점수입니다. 공식적인 국제 품질관리 표준지표가 아닙니다.\n\n합성수지 Batch 생산에서의 의미:\nCpk, Western Rule, Target 편차, 산포 및 이상치 등 여러 요소를 종합하여 현재 품질 상태를 빠르게 파악하기 위한 내부 보조지표입니다.\n\n현재 프로그램에서의 사용:\n기존 품질관리 화면과 이력 호환성을 위해 내부 종합지표로 사용됩니다. Smart Analysis의 Internal Risk Score와는 별개의 지표입니다.\n\n해석 방법:\n점수가 낮을수록 프로그램에서 관리가 필요한 위험 신호가 많다고 해석할 수 있으나, PSI만으로 제품 불량이나 원인을 확정하지 않습니다.', isVisible: true, order: 8 },
            { name: 'TBI', category: '내부 지표', definition: '원론적 정의:\nTarget을 기준으로 현재 측정값이 어느 방향으로 얼마나 이격되어 있는지를 해당 방향의 허용거리로 정규화한 내부 지표입니다.\n\n합성수지 Batch 생산에서의 의미:\n제품마다 Target과 USL/LSL 간 거리가 달라도 현재 Batch가 Target에서 어느 방향으로 얼마나 치우쳤는지 상대적으로 파악하는 데 활용합니다.\n\n현재 프로그램에서의 사용:\nQuality Condition Trend 및 Smart Analysis의 핵심 Target 편향 지표로 사용합니다.\n\n해석 방법:\n0은 Target에 해당하며, +1은 USL 방향의 한계, -1은 LSL 방향의 한계에 해당합니다. 규격을 벗어나면 |TBI|가 1을 초과할 수 있습니다.', isVisible: true, order: 9 },
            { name: 'Baseline', category: '내부 지표', definition: '원론적 정의:\n정상적인 과거 상태와 비교하기 위한 기준 데이터 집합입니다.\n\n합성수지 Batch 생산에서의 의미:\n동일 제품/항목의 과거 정상 Batch가 현재 Batch와 비교했을 때 평소 범위인지 판단하기 위한 기준입니다.\n\n현재 프로그램에서의 사용:\n충분한 과거 데이터가 확보된 경우 정상 패턴 비교에 활용합니다.\n\n해석 방법:\nBaseline이 없으면 장기 정상 상태 판단 신뢰도가 낮아지고 최근 변화 중심으로 분석합니다.', isVisible: true, order: 10 },
            { name: 'Sudden Jump', category: '패턴', definition: '원론적 정의:\n직전 Batch와의 변화량이 해당 제품의 평소 Batch-to-Batch 변동성에 비해 비정상적으로 큰 급격한 변화 패턴입니다.\n\n합성수지 Batch 생산에서의 의미:\n특정 Batch에서 점도, 고형분, 산가 등의 값이 평소보다 갑자기 크게 변하는 상황을 탐지하는 데 활용합니다.\n\n현재 프로그램에서의 사용:\n직전 Batch와의 변화량을 Typical Variation과 비교하여 급격한 변화 여부를 판단합니다.\n\n해석 방법:\nSudden Jump는 원인 자체가 아니라 관찰된 데이터 패턴입니다. 원료 LOT, 배합·투입, 반응조건, 샘플링 및 측정 상태 등을 추가로 확인해야 합니다.', isVisible: true, order: 11 },
            { name: 'Target Drift', category: '패턴', definition: '원론적 정의:\n여러 Batch에 걸쳐 측정값의 중심이 Target을 기준으로 일정 방향으로 이동하는 패턴입니다.\n\n합성수지 Batch 생산에서의 의미:\n점도, 산가, 고형분 등의 값이 여러 Batch에 걸쳐 Target보다 높은 방향 또는 낮은 방향으로 지속적으로 이동하는 상황을 탐지합니다.\n\n현재 프로그램에서의 사용:\n최근 3~5 Batch의 방향성, Target Bias 변화 및 과거 정상 Baseline과의 차이를 종합하여 판단합니다.\n\n해석 방법:\nDrift 자체는 특정 원인을 의미하지 않습니다. 원료 특성, 반응 온도·시간, 촉매, 혼합, 측정 조건 등의 원인 후보를 추가 확인합니다.', isVisible: true, order: 12 },
            { name: 'Spread Increase', category: '패턴', definition: '원론적 정의:\n공정 변동 또는 산포가 과거보다 증가하는 현상입니다.\n\n합성수지 Batch 생산에서의 의미:\n동일 수지를 생산해도 Batch 간 편차가 점점 커지는 상태입니다.\n\n현재 프로그램에서의 사용:\n최근 5 Batch의 산포와 Baseline 또는 과거 변동성을 비교하는 데 활용합니다.\n\n해석 방법:\n평균 중심이 정상이어도 산포가 커지면 공정 안정성이 저하될 수 있습니다.', isVisible: true, order: 13 },
            { name: 'Target Approach', category: '패턴', definition: '원론적 정의:\n측정값이 목표값보다 규격 한계 방향으로 접근하는 상태입니다.\n\n합성수지 Batch 생산에서의 의미:\n현재 규격 이탈은 아니지만 Target에서 멀어지고 있어 향후 Spec-Out 위험이 커질 수 있는 상태입니다.\n\n현재 프로그램에서의 사용:\nTBI가 임계 수준에 접근할 때 참고 패턴으로 사용합니다.\n\n해석 방법:\n현재 불량이라는 의미가 아니라 주의 및 모니터링이 필요한 상태입니다.', isVisible: true, order: 14 },
            { name: 'Internal Risk Score', category: '내부 지표', definition: '원론적 정의:\n현재 프로그램에서 여러 이상징후를 종합해 내부적으로 표시하는 위험도 점수입니다.\n\n합성수지 Batch 생산에서의 의미:\nSpec-Out, Sudden Jump, Drift, Spread Increase, Target 편향 등을 종합해 QA가 현재 상태를 빠르게 파악하도록 지원합니다.\n\n현재 프로그램에서의 사용:\nAI 품질 변화 위험도를 0~100 범위로 표현합니다.\n\n해석 방법:\n공식 품질지표가 아니며 QA 의사결정을 지원하는 보조지표입니다.', isVisible: true, order: 15 }
        ];
      });

      useEffect(() => {
        localStorage.setItem('qualityAppTerms', JSON.stringify(qualityAppTerms));
      }, [qualityAppTerms]);

      const logAudit = (action, details) => {
        const newLog = {
          id: Date.now(),
          timestamp: new Date().toISOString(),
          userName: userName || 'Unknown',
          clientId: clientId,
          action,
          ...details
        };
        setAuditLogs(prev => {
            const nextLogs = [newLog, ...prev];
            if (nextLogs.length > 2000) nextLogs.length = 2000;
            return nextLogs;
        });
        return newLog;
      };

      const updateAndSync = async (updatedEntries, auditAction = null, auditDetails = null) => {
        setEntries(updatedEntries);
        let currentAuditLogs = auditLogs;
